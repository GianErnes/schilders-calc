<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ontvangst bevestigen · Ernes Schilders</title>
<!--
  bevestig.html v1.0 (09-10-2026) — hoort bij planning.html v0.19.x,
  Edge Function planning-kennisgeving v3.1 (zet de link in de mail) en
  planning-kennisgeving-bevestig v2 (de API erachter).

  De klant komt hier via de knop "Ja, ik heb dit ontvangen" in een
  kennisgevingsmail: bevestig.html?t=<token>. De pagina haalt op wat voor
  kennisgeving het is (GET), toont één knop, en pas de klik (POST) zet
  bevestigd_op in plan_kennisgevingen. Twee stappen met opzet: mailscanners
  openen links automatisch, maar klikken geen knoppen.

  Waarom hier en niet in de Edge Function: Supabase herschrijft text/html
  bij een GET naar text/plain (docs, "HTML content is not supported").
  Geen login, geen Supabase-sleutel: de functie draait met Verify JWT UIT en
  het token in de link is het slot.
-->
<style>
  body { margin: 0; background: #f4f1ec; font-family: Arial, Helvetica, sans-serif; color: #222; }
  .kaart { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 10px; padding: 28px 30px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 18px 0 10px; }
  p { font-size: 16px; line-height: 1.55; margin: 0 0 10px; }
  .knop { display: block; width: 100%; max-width: 360px; margin-top: 22px; background: #d2502a; color: #fff; border: 0; border-radius: 6px; padding: 14px 26px; font-size: 17px; font-weight: bold; cursor: pointer; }
  .knop:disabled { opacity: .6; cursor: default; }
  .groen { color: #16a34a; font-weight: bold; }
  .klein { font-size: 13px; color: #777; margin-top: 26px; border-top: 1px solid #eee; padding-top: 12px; }
  .klein a { color: #1a5fb4; }
</style>
</head>
<body>
<div class="kaart">
  <img src="https://www.ernes.nl/images/handtekening/ernes-logo.png" width="160" alt="Ernes Schilders" style="display:block">
  <h1 id="kop">Even geduld…</h1>
  <div id="tekst"><p>De gegevens worden opgehaald.</p></div>
  <button id="knop" class="knop" type="button" hidden>Ja, ik heb dit ontvangen</button>
  <p class="klein">Ernes Schilders · Koperslager 2, 6422 PR Heerlen · 06-21220045 · <a href="https://www.ernes.nl">www.ernes.nl</a></p>
</div>
<script>
(function () {
  var API = 'https://gjcjpigirqbpkjkymbio.supabase.co/functions/v1/planning-kennisgeving-bevestig';
  var TEL = '06-21220045';
  var kop = document.getElementById('kop'), tekst = document.getElementById('tekst'), knop = document.getElementById('knop');
  var token = (new URLSearchParams(location.search).get('t') || '').trim();

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function toon(titel, html, metKnop) {
    kop.textContent = titel;
    tekst.innerHTML = html;
    knop.hidden = !metKnop;
  }
  function ongeldig() {
    toon('Deze link is niet geldig',
      '<p>De bevestigingslink klopt niet of is niet meer in gebruik.</p>' +
      '<p>Heeft u onze planning ontvangen? Dan hoeft u niets te doen. Twijfelt u, bel ons gerust op ' + TEL + '.</p>', false);
  }
  function storing() {
    toon('Even geen verbinding',
      '<p>Uw bevestiging kon niet worden verwerkt. Probeer het later nog eens, of bel ons op ' + TEL + '.</p>', false);
  }
  // Wat de pagina laat zien per antwoord van de functie. Los getest (bevestig_test.js).
  function verwerkAntwoord(j, naKlik) {
    if (!j || !j.ok) { ongeldig(); return; }
    var wat = esc(j.omschrijving || 'onze kennisgeving');
    if (j.status === 'open') {
      toon('Ontvangst bevestigen',
        '<p>U heeft ' + wat + ' ontvangen.</p>' +
        '<p>Klik op de knop om te bevestigen dat het bericht bij u is aangekomen. Zo weten wij dat de planning bekend is en hoeven wij u niet na te bellen.</p>', true);
    } else if (j.status === 'bevestigd' || (naKlik && j.status === 'al_bevestigd')) {
      toon('Bedankt!',
        '<p class="groen">Uw bevestiging is ontvangen.</p>' +
        '<p>U heeft bevestigd dat ' + wat + ' bij u is aangekomen. Wij zien u graag op de afgesproken dag.</p>', false);
    } else if (j.status === 'al_bevestigd') {
      toon('Al bevestigd',
        '<p>U heeft de ontvangst van ' + wat + ' al bevestigd. Dank u wel, er is verder niets nodig.</p>', false);
    } else { ongeldig(); }
  }
  if (typeof module !== 'undefined') { module.exports = { verwerkAntwoord: verwerkAntwoord }; return; }

  function vraag(init) {
    return fetch(API + (init ? '' : '?t=' + encodeURIComponent(token)), init || {})
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); });
  }
  if (!token) { ongeldig(); return; }
  vraag().then(function (a) { a.status === 404 ? ongeldig() : verwerkAntwoord(a.j, false); }).catch(storing);

  knop.addEventListener('click', function () {
    knop.disabled = true; knop.textContent = 'Bezig…';
    vraag({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token }) })
      .then(function (a) { a.status === 404 ? ongeldig() : verwerkAntwoord(a.j, true); })
      .catch(function () { knop.disabled = false; knop.textContent = 'Ja, ik heb dit ontvangen'; storing(); });
  });
})();
</script>
</body>
</html>
