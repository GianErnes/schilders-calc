<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9">
<title>Taken — Ernes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#f6f7f9;
    --card:#ffffff;
    --ink:#191c21;
    --ink-soft:#5b636e;
    --ink-faint:#98a0ac;
    --line:#e7eaee;
    --line-soft:#eef1f4;
    --hero-tint:#eef3ff;
    --hero-line:#cdddff;
    --groen:#158048;
    --groen-tint:#ecfaf1;
    --groen-lijn:#c7ecd6;
    /* de vijf mensen, als dabs verf */
    --gian:#2563eb;   /* blauw  */
    --max:#f97316;    /* oranje */
    --maud:#f28b82;   /* zalm   */
    --jens:#eab308;   /* geel   */
    --bjorn:#16a34a;  /* groen  */
    --overig:#98a0ac; /* grijs, onbekende Yoobi-naam */
    --radius:16px;
    --shadow:0 1px 2px rgba(20,25,35,.05), 0 8px 24px rgba(20,25,35,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:430px;margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;
  }

  /* kop */
  .appbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 20px 12px;flex:none;
  }
  .brand-logo{height:44px;width:auto;display:block}
  .titlecol{text-align:right}
  .titlecol h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
  .titlecol .date{font-size:12.5px;color:var(--ink-soft);font-weight:500}

  /* lijst */
  .list{flex:1;padding:6px 16px calc(130px + env(safe-area-inset-bottom));}

  .melding{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;font-size:14px;color:var(--ink-soft);font-weight:600;
    box-shadow:var(--shadow);line-height:1.5;
  }
  .melding.fout{border-color:#f3c1c1;background:#fdf6f6;color:#a43d3d}

  .section{margin-bottom:9px;--balk:var(--card);--balkrand:var(--line);--vak:transparent}
  .section[data-key="vandaag"]{--balk:#fdf1ee;--balkrand:#f3ddd6;--vak:#fef7f5}
  .section[data-key="los"]{--balk:#fcf8ea;--balkrand:#efe7cb;--vak:#fdfbf2}
  .section[data-key="herhalend"]{--balk:#f0f5fc;--balkrand:#dbe7f4;--vak:#f6f9fd}
  .section[data-key="klant"]{--balk:#fdf1ee;--balkrand:#f3ddd6;--vak:#fef7f5}
  .section[data-key="voltooid"]{--balk:#f0f8f3;--balkrand:#d9ecdf;--vak:#f6faf7}
  .section[data-key="vervallen"]{--balk:#f2f3f5;--balkrand:#e5e8eb;--vak:#f4f5f7}
  .head{
    width:100%;display:flex;align-items:center;gap:11px;
    background:var(--balk);border:1px solid var(--balkrand);border-radius:14px;
    padding:11px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;
    box-shadow:var(--shadow);transition:border-color .15s, background .15s;
  }
  .head:focus-visible{outline:2.5px solid var(--gian);outline-offset:2px}
  .head .cluster{display:flex;align-items:center}
  .head .cluster .d{width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 2.5px var(--card);margin-left:-6px}
  .head .cluster .d:first-child{margin-left:0}
  .head .cluster .more{
    margin-left:-6px;width:15px;height:15px;border-radius:50%;background:#eef1f4;color:var(--ink-faint);
    box-shadow:0 0 0 2.5px var(--card);font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center
  }
  .head .title{flex:1;min-width:0}
  .head .title .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
  .head .title .sub{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:2px}
  .head .count{
    font-size:13px;font-weight:800;color:var(--ink-soft);
    background:#f0f2f5;border-radius:999px;padding:2px 9px;min-width:26px;text-align:center
  }
  .chev{width:9px;height:9px;border-right:2.2px solid var(--ink-faint);border-bottom:2.2px solid var(--ink-faint);transform:rotate(-45deg);transition:transform .2s;margin-left:2px;flex:none}
  .section.open .chev{transform:rotate(45deg)}

  .cards{display:none}
  .section.open .cards{display:block;background:var(--vak);border-radius:12px;padding:2px 7px}
  .cards .inner{padding:7px 0;display:flex;flex-direction:column;gap:8px}

  .card{
    display:flex;align-items:flex-start;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:12px 13px;cursor:pointer;
    box-shadow:0 1px 2px rgba(20,25,35,.04);transition:transform .08s, border-color .15s;
  }
  .card:active{transform:scale(.985)}
  .card:focus-visible{outline:2.5px solid var(--gian);outline-offset:2px}
  .card .who{width:14px;height:14px;border-radius:50%;flex:none;margin-top:2px;box-shadow:0 0 0 2px #fff}
  .card .body{flex:1;min-width:0}
  .card .ttl{font-size:14.5px;font-weight:650;line-height:1.3}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;line-height:1}
  .pill.time{background:#eef3ff;color:#2b5bd0}
  .pill.rep{background:#fdf3e7;color:#b45f13}
  .pill.tel{background:var(--groen-tint);color:var(--groen)}
  .pill.yoobi{background:#f1f0fb;color:#6d5bb8}
  .pill.date{background:#f0f2f5;color:var(--ink-soft)}
  .pill.klant{background:#f0f2f5;color:var(--ink-soft)}
  .pill.foto{background:#f0f2f5;color:var(--ink-soft)}
  .card .bell{flex:none;color:var(--ink-faint);font-size:15px;margin-top:1px}
  .card .bell.on{color:var(--gian)}

  /* hero: vandaag-actueel opgelicht */
  .card.hero{
    background:#ffffff;
    border:1.5px solid #e9b8ad;
    box-shadow:0 2px 4px rgba(192,87,68,.10), 0 10px 22px rgba(192,87,68,.10);
    position:relative;
  }
  .card.hero .now{
    position:absolute;top:-8px;left:13px;background:#c05744;color:#fff;
    font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 8px;border-radius:999px;text-transform:uppercase
  }
  .card.hero .ttl{font-size:15.5px;font-weight:750;padding-top:2px}


  /* klantopvolging afgeschermd overdag */
  .section.gated .head{background:#f2f3f5;border-style:dashed;border-color:#d7dbe1}
  .section.gated .head .title .t{color:var(--ink-soft)}
  .gatehint{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#f2f3f5;border:1px dashed #d7dbe1;border-radius:12px;
    padding:9px 12px;margin-top:8px;font-size:12px;color:var(--ink-soft);font-weight:600
  }
  .gatehint button{
    font:inherit;font-size:12px;font-weight:700;color:var(--gian);background:#fff;
    border:1px solid var(--hero-line);border-radius:999px;padding:5px 12px;cursor:pointer
  }
  .section.gated.open .gatehint{display:none}
  .section.gated.open .head{background:var(--balk);border-style:solid;border-color:var(--balkrand)}
  .section.gated.open .head .title .t{color:var(--ink)}

  /* voltooid + vervallen gedempt */
  .section.done .head,.section.lapsed .head{box-shadow:none}
  .section.done .card{opacity:.72}
  .section.done .card .ttl{text-decoration:line-through;color:var(--ink-soft);font-weight:600}
  .section.lapsed .head .title .t{color:var(--ink-faint)}

  .hidnote{font-size:12px;color:var(--ink-faint);font-weight:600;padding:2px 4px 0}

  /* verdeling onderaan, stil, om te meten */
  .meten{margin:4px 6px 0;padding:12px 12px 4px;border-top:1px solid var(--line-soft)}
  .meten .lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .meten .lbl b{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .meten .lbl span{font-size:11px;color:var(--ink-faint);font-weight:600}
  .meten .bar{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px}
  .meten .bar i{display:block}
  .meten .legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}
  .meten .legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-faint);font-weight:600}
  .meten .legend .d{width:8px;height:8px;border-radius:50%}

  .voet{
    margin:10px 6px 0;padding:0 12px;display:flex;justify-content:space-between;
    font-size:11px;color:var(--ink-faint);font-weight:600;
  }
  .voet button{
    font:inherit;font-size:11px;font-weight:600;color:var(--ink-faint);
    background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;
  }

  /* plus-knop, onderin voor de duim */
  .fab{
    position:fixed;right:calc(50% - 215px + 20px);bottom:calc(26px + env(safe-area-inset-bottom));
    width:60px;height:60px;border-radius:50%;
    background:var(--gian);color:#fff;border:none;cursor:pointer;
    box-shadow:0 6px 16px rgba(37,99,235,.4);display:flex;align-items:center;justify-content:center;
    z-index:6;transition:transform .1s
  }
  @media (max-width:430px){ .fab{right:20px} }
  .fab:active{transform:scale(.94)}
  .fab::before,.fab::after{content:"";position:absolute;background:#fff;border-radius:2px}
  .fab::before{width:22px;height:3px}
  .fab::after{width:3px;height:22px}
  .fab:focus-visible{outline:3px solid #fff;outline-offset:-6px}

  /* detailvel */
  .scrim{position:fixed;inset:0;background:rgba(20,25,35,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:9;
    max-width:430px;margin:0 auto;
    background:var(--card);border-radius:24px 24px 0 0;
    box-shadow:0 -8px 40px rgba(20,25,35,.25);
    transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
    max-height:88vh;overflow-y:auto;
    padding:8px 20px calc(26px + env(safe-area-inset-bottom));
  }
  .sheet.show{transform:translateY(0)}
  .grip{width:38px;height:5px;border-radius:3px;background:#dfe3e9;margin:6px auto 12px}
  .sheet h2{margin:0 0 2px;font-size:19px;font-weight:750;line-height:1.25}
  .titelinput{
    width:100%;border:none;border-bottom:2px solid var(--line);background:transparent;
    font:inherit;font-size:19px;font-weight:750;line-height:1.25;color:var(--ink);
    padding:2px 0 8px;margin:0 0 2px;
  }
  .titelinput:focus{outline:none;border-bottom-color:var(--hero-line)}
  .titelinput::placeholder{color:var(--ink-faint);font-weight:600}
  .sheet .who-row{display:flex;align-items:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
  .fld{margin-top:16px}
  .fld .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:7px}
  .note{
    width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
    font:inherit;font-size:16px;color:var(--ink);resize:none;background:#fbfcfd
  }
  .note:focus{outline:2px solid var(--hero-line);border-color:var(--hero-line)}
  .photo{
    border:1.5px dashed #ccd3dc;border-radius:12px;padding:16px;text-align:center;color:var(--ink-faint);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;background:#fbfcfd;cursor:pointer
  }
  .fotowrap{position:relative;display:none}
  .fotowrap img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
  .fotowrap .weg{
    position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
    background:rgba(20,25,35,.72);color:#fff;border:none;cursor:pointer;
    font-size:15px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .row2{display:flex;gap:10px}
  .row2 .box{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfcfd}
  .kk{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint)}
  .vv{font-size:14.5px;font-weight:650;margin-top:3px}
  .row2 input{
    width:100%;border:none;background:transparent;font:inherit;font-size:16px;font-weight:650;
    color:var(--ink);padding:2px 0 0;margin-top:1px;
  }
  .row2 input:focus{outline:none}
  .veldinput{
    width:100%;border:1px solid var(--line);border-radius:12px;background:#fbfcfd;
    font:inherit;font-size:16px;color:var(--ink);padding:11px 12px;
  }
  .veldinput:focus{outline:2px solid var(--hero-line);border-color:var(--hero-line)}

  /* soortkeuze: drie knopjes */
  .segment{display:flex;gap:8px}
  .segment button{
    flex:1;font:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);
    background:#fbfcfd;border:1px solid var(--line);border-radius:11px;padding:10px 6px;cursor:pointer;
  }
  .segment button.sel{background:var(--gian);border-color:var(--gian);color:#fff}

  /* ritme-kiezer */
  .ritme{display:flex;gap:10px;margin-top:10px;align-items:center}
  .ritme .elke{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .ritme input{
    width:64px;border:1px solid var(--line);border-radius:11px;background:#fbfcfd;
    font:inherit;font-size:16px;font-weight:650;text-align:center;padding:9px 4px;color:var(--ink);
  }
  .ritme select{
    flex:1;border:1px solid var(--line);border-radius:11px;background:#fbfcfd;
    font:inherit;font-size:16px;font-weight:650;padding:9px 10px;color:var(--ink);
  }

  .repbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfcfd}
  .repbox .uitleg{font-size:11.5px;font-weight:600;color:var(--ink-faint);margin-top:3px}
  .toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fbfcfd;cursor:pointer}
  .toggle .sw{width:44px;height:26px;border-radius:999px;background:var(--gian);position:relative;flex:none;transition:background .15s}
  .toggle .sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .15s}
  .toggle.uit .sw{background:#d5dae1}
  .toggle.uit .sw::after{right:21px}
  .toggle span:first-child{font-size:14.5px;font-weight:650}
  .snooze{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .snooze b{align-self:center;font-size:12px;color:var(--ink-faint);font-weight:700;margin-right:2px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit}
  .chip:active{background:#f0f2f5}
  .callbtn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--groen-tint);color:var(--groen);border:1px solid var(--groen-lijn);border-radius:12px;
    padding:13px;font:inherit;font-size:15px;font-weight:750;cursor:pointer;text-decoration:none;margin-top:10px
  }
  .picker{display:flex;gap:12px;margin-top:4px}
  .picker button{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;position:relative;box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--line)}
  .picker button.sel{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--gian)}
  .picker button.sel::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800}
  .picker button:disabled{opacity:.28;cursor:default}

  /* grote actieknoppen in het vel */
  .klaarknop{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--groen);color:#fff;border:none;border-radius:12px;
    padding:14px;font:inherit;font-size:15.5px;font-weight:750;cursor:pointer;margin-top:14px;
  }
  .klaarknop:active{transform:scale(.985)}
  .klaarknop.terug{background:#fbfcfd;color:var(--ink-soft);border:1px solid var(--line)}
  .bewaarknop{
    width:100%;background:var(--gian);color:#fff;border:none;border-radius:12px;
    padding:14px;font:inherit;font-size:15.5px;font-weight:750;cursor:pointer;margin-top:18px;
  }
  .bewaarknop:active{transform:scale(.985)}
  .bewaarknop:disabled{opacity:.55}
  .weglink{
    display:block;margin:14px auto 4px;background:none;border:none;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-faint);text-decoration:underline;
  }

  /* aanmeldscherm: eenmalig per toestel */
  .login{
    position:fixed;inset:0;z-index:20;background:var(--paper);
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .login.zie{display:flex}
  .login .kaart{
    width:100%;max-width:360px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
    padding:26px 22px;
  }
  .login .kaart img{height:52px;display:block;margin:0 auto 6px}
  .login .kaart p{margin:10px 0 18px;font-size:13.5px;color:var(--ink-soft);font-weight:600;text-align:center;line-height:1.45}
  .login input{
    width:100%;border:1px solid var(--line);border-radius:12px;background:#fbfcfd;
    font:inherit;font-size:16px;padding:12px 13px;margin-bottom:10px;color:var(--ink);
  }
  .login input:focus{outline:2px solid var(--hero-line);border-color:var(--hero-line)}
  .login .knop{
    width:100%;border:none;border-radius:12px;background:var(--gian);color:#fff;
    font:inherit;font-size:15px;font-weight:750;padding:13px;cursor:pointer;margin-top:4px;
  }
  .login .knop:active{transform:scale(.985)}
  .login .foutregel{
    display:none;margin-top:12px;font-size:12.5px;font-weight:600;color:#a43d3d;
    background:#fdf6f6;border:1px solid #f3c1c1;border-radius:10px;padding:9px 11px;line-height:1.4;
  }
  .login .foutregel.zie{display:block}

  /* toast, met optionele actieknop */
  .toast{
    position:fixed;left:50%;transform:translateX(-50%) translateY(16px);
    bottom:calc(104px + env(safe-area-inset-bottom));
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
    padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.22);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    max-width:340px;text-align:center;z-index:12;
    display:flex;align-items:center;gap:12px;
  }
  .toast.zie{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .toast button{
    font:inherit;font-size:13px;font-weight:800;color:#8ab4ff;background:none;
    border:none;cursor:pointer;padding:0;white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

  <!-- detailvel -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Taak">
    <div class="grip"></div>
    <h2 id="s_title" style="display:none">Taak</h2>
    <input class="titelinput" id="s_titelinput" placeholder="Wat moet er gebeuren?" style="display:none">
    <div class="who-row" id="s_whorow"></div>

    <button class="klaarknop" id="s_klaar" style="display:none">✓ Afvinken</button>

    <div class="fld" id="s_soortwrap" style="display:none">
      <div class="k">Soort</div>
      <div class="segment" id="s_segment">
        <button type="button" data-s="eenmalig">Eenmalig</button>
        <button type="button" data-s="herhalend">Herhalend ↻</button>
      </div>
      <div class="ritme" id="s_ritme" style="display:none">
        <span class="elke">elke</span>
        <input type="number" id="s_ritme_n" min="1" max="365" value="1" inputmode="numeric">
        <select id="s_ritme_eenheid">
          <option value="dag">dagen</option>
          <option value="week" selected>weken</option>
          <option value="maand">maanden</option>
          <option value="jaar">jaar</option>
        </select>
      </div>
    </div>

    <div class="fld" id="s_notewrap">
      <div class="k">Notitie</div>
      <textarea class="note" id="s_note" placeholder="Typ hier je aantekeningen, maten, kleurcodes…"></textarea>
    </div>

    <div class="fld" id="s_fotowrap_fld">
      <div class="k">Foto</div>
      <div class="photo" id="s_photo">＋ Foto toevoegen</div>
      <div class="fotowrap" id="s_fotowrap">
        <img id="s_fotoimg" alt="Foto bij de taak">
        <button type="button" class="weg" id="s_fotoweg" aria-label="Foto verwijderen">✕</button>
      </div>
      <input type="file" id="s_fotofile" accept="image/*" style="display:none">
    </div>

    <div class="fld">
      <div class="k">Wanneer</div>
      <div class="row2" id="s_wanneer_lezen" style="display:none">
        <div class="box"><div class="kk">Datum</div><div class="vv" id="s_date">—</div></div>
        <div class="box"><div class="kk">Tijd</div><div class="vv" id="s_tijd">—</div></div>
      </div>
      <div class="row2" id="s_wanneer_invullen" style="display:none">
        <div class="box"><div class="kk">Datum</div><input type="date" id="s_datum_in"></div>
        <div class="box"><div class="kk">Tijd</div><input type="time" id="s_tijd_in"></div>
      </div>
    </div>

    <div class="fld" id="s_repwrap" style="display:none">
      <div class="k">Herhaling</div>
      <div class="repbox">
        <div class="vv" id="s_rep">—</div>
        <div class="uitleg">telt door vanaf de vaste datum</div>
      </div>
    </div>

    <div class="fld" id="s_vandaagwrap" style="display:none">
      <div class="k">Dagkeuze</div>
      <div class="toggle" id="s_vandaag"><span id="s_vandaagtekst">Vandaag oppakken</span><span class="sw"></span></div>
    </div>

    <div class="fld" id="s_piepwrap">
      <div class="k">Melding</div>
      <div class="toggle" id="s_toggle"><span id="s_toggletekst">Melding aan</span><span class="sw"></span></div>
      <div class="snooze" id="s_snooze"><b>Uitstellen</b>
        <button class="chip" data-snooze="min5">5 min</button><button class="chip" data-snooze="uur1">1 uur</button>
        <button class="chip" data-snooze="avond">vanavond</button><button class="chip" data-snooze="morgen">morgen</button>
      </div>
    </div>

    <div class="fld" id="s_telwrap" style="display:none">
      <div class="k">Bellen</div>
      <input class="veldinput" type="tel" id="s_telinput" placeholder="Telefoonnummer (optioneel)" style="display:none">
      <a class="callbtn" id="s_tel" href="#" style="display:none">✆</a>
    </div>

    <div class="fld" id="s_pickwrap">
      <div class="k">Wie doet het</div>
      <div class="picker" id="s_picker">
        <button data-p="gian"  style="background:var(--gian)"  aria-label="Gian"></button>
        <button data-p="max"   style="background:var(--max)"   aria-label="Max"></button>
        <button data-p="maud"  style="background:var(--maud)"  aria-label="Maud"></button>
        <button data-p="jens"  style="background:var(--jens)"  aria-label="Jens"></button>
        <button data-p="bjorn" style="background:var(--bjorn)" aria-label="Bjorn"></button>
      </div>
    </div>

    <button class="bewaarknop" id="s_bewaar" style="display:none">Bewaren</button>
    <button class="weglink" id="s_weg" style="display:none">Taak verwijderen</button>
  </div>

  <!-- aanmeldscherm: eenmalig per toestel, daarna nooit meer -->

const PERSOON = {
  gian:   { naam:'Gian',   css:'var(--gian)'   },
  max:    { naam:'Max',    css:'var(--max)'    },
  maud:   { naam:'Maud',   css:'var(--maud)'   },

let IK = null;            /* { persoon, rol, yoobi_naam } */

/* Open/dicht-stand van de rubrieken, blijft staan over renders heen. */
const OPEN_STAND = {};

/* Het vel: wat er nu open staat. */
let VEL = null;           /* { modus:'nieuw'|'eigen'|'yoobi'|'klaar', taak, soort, persoon, fotoBlob, fotoWeg } */

/* Ongedaan maken van de laatste afvink. */
let LAATSTE_AFVINK = null;

/* ────────────────────────────────────────────────────────
   Datum-gereedschap
   ──────────────────────────────────────────────────────── */
const WD = ['zo','ma','di','wo','do','vr','za'];
const MND_KORT = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MND_LANG = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

function datumKort(){
  const d = new Date();
  return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MND_LANG[d.getMonth()];
}
function lokaalISO(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function parseTijdstip(s){
  if(!s) return null;
  const d = new Date(String(s).replace(' ','T'));
  return isNaN(d) ? null : d;
}
function naarTimestamp(datumStr, tijdStr){
  if(!datumStr) return null;
  return datumStr + 'T' + (tijdStr || '00:00') + ':00';
}
function zelfdeDag(a, b){
  return a && b && a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function datumTekst(d){
  if(!d) return '';
  const nu = new Date();
  const morgen = new Date(nu); morgen.setDate(nu.getDate() + 1);
  if(zelfdeDag(d, nu)) return 'vandaag';
  if(zelfdeDag(d, morgen)) return 'morgen';
  const dagen = (d - nu) / 86400000;
  if(dagen > 0 && dagen < 6) return WD[d.getDay()];
  let t = d.getDate() + ' ' + MND_KORT[d.getMonth()];
  if(d.getFullYear() !== nu.getFullYear()) t += ' ' + d.getFullYear();
  return t;
}
function tijdTekst(d){
  if(!d) return '';
  const u = d.getHours(), m = d.getMinutes();
  if(u === 0 && m === 0) return '';
  return String(u).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function herhalingTekst(n, eenheid){
  if(!n || !eenheid) return '';
  if(n === 1) return { dag:'elke dag', week:'elke week', maand:'elke maand', jaar:'elk jaar' }[eenheid] || '';
  const mv = { dag:'dagen', week:'weken', maand:'maanden', jaar:'jaar' }[eenheid] || eenheid;
  return 'elke ' + n + ' ' + mv;
}
/* Volgende datum in het ritme, gerekend vanaf de vaste ankerdatum. */
function volgendeDatum(anker, n, eenheid){
  const d = anker ? new Date(anker) : new Date();
  const nu = new Date();
  let stop = 0;
  do{
    if(eenheid === 'dag') d.setDate(d.getDate() + n);
    else if(eenheid === 'week') d.setDate(d.getDate() + 7 * n);
    else if(eenheid === 'maand') d.setMonth(d.getMonth() + n);
    else d.setFullYear(d.getFullYear() + n);
    stop++;
  } while(d <= nu && stop < 1000);
  return d;
}
function timestampVan(d){
  return lokaalISO(d) + 'T' + String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0') + ':00';
}

/* ────────────────────────────────────────────────────────
   Verrijken: per taak persoon, rubriek en weergavedatum
   ──────────────────────────────────────────────────────── */
function persoonVan(t){
  if(t.bron === 'eigen') return t.toegewezen_aan || 'overig';
  return MAP_YOOBI[t.username] || 'overig';
}
function rubriekVan(t, nu, vandaagISO){
  if(t.voltooid_op) return 'voltooid';
  if(t.status === 'vervallen') return 'vervallen';
  const dagkeuze = t.vandaag && t.vandaag_op === vandaagISO;
  const eigenVandaag = t.bron === 'eigen' && t._gepland && zelfdeDag(t._gepland, nu);
  if(dagkeuze || eigenVandaag) return 'vandaag';
  if(t.bron === 'yoobi') return 'klant';
  if(t.soort === 'herhalend') return 'herhalend';
  return 'los';
}
function verrijk(rijen){
  const nu = new Date();
  const vandaagISO = lokaalISO(nu);
  return rijen.map(r => {
    const t = Object.assign({}, r);
    t._gepland = parseTijdstip(t.gepland_op);
    t._voltooid = parseTijdstip(t.voltooid_op);
    t._persoon = persoonVan(t);
    t._rubriek = rubriekVan(t, nu, vandaagISO);
    t._binnenWeek = !t._gepland || (t._gepland - nu) < 7 * 86400000;
    return t;
  });
}

/* ────────────────────────────────────────────────────────
   DATABRON: de echte tabel. RLS filtert op de server.
   ──────────────────────────────────────────────────────── */
async function haalTaken(){
  const { data, error } = await sb
    .from('taken')
    .select('*')
    .order('gepland_op', { ascending: true, nullsFirst: false });
  if(error) throw error;
  return verrijk(data || []);
}

/* ────────────────────────────────────────────────────────
   Rubrieken, van boven naar beneden
   ──────────────────────────────────────────────────────── */
const NA_VIER = new Date().getHours() >= 16;

const RUBRIEKEN = [
  { key:'vandaag',   titel:'Vandaag',        sub:'jouw keuze plus de meldingen van vandaag',        open:true,    klasse:'today' },
  { key:'los',       titel:'Losse taken',    sub:'je eigen taken',                        open:false },
  { key:'herhalend', titel:'Herhalend ↻',    sub:'',                                         open:false },
  { key:'klant',     titel:'Klantopvolging', sub:'uit Yoobi · alleen bekijken',              open:NA_VIER, klasse:'gated' },
  { key:'voltooid',  titel:'Voltooid',       sub:'je eigen afgevinkte taken',                open:false,   klasse:'done' },
  { key:'vervallen', titel:'Vervallen',      sub:'van vóór 2025 · voor Maud om na te lopen', open:false,   klasse:'lapsed' },
];
RUBRIEKEN.forEach(r => { OPEN_STAND[r.key] = r.open; });

/* ────────────────────────────────────────────────────────
   Opbouw
   ──────────────────────────────────────────────────────── */
function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cluster(taken){
  const uniek = PERSOON_VOLGORDE.filter(p => taken.some(t => t._persoon === p));
  const eerste = uniek.slice(0,4);
  const rest = uniek.length - eerste.length;
  let h = eerste.map(p => '<i class="d" style="background:' + PERSOON[p].css + '"></i>').join('');
  if(rest > 0) h += '<span class="more">+' + rest + '</span>';
  return '<span class="cluster">' + h + '</span>';
}

function pillen(t){
  const p = [];
  const dTekst = datumTekst(t._gepland);
  const uTekst = tijdTekst(t._gepland);
  if(t._rubriek !== 'voltooid' && t._rubriek !== 'vervallen'){
    if(uTekst && dTekst === 'vandaag') p.push('<span class="pill time">◷ ' + uTekst + '</span>');
    else if(dTekst) p.push('<span class="pill time">◷ ' + esc(dTekst + (uTekst ? ' ' + uTekst : '')) + '</span>');
  }
  const rep = herhalingTekst(t.herhaling_n, t.herhaling_eenheid);
  if(rep) p.push('<span class="pill rep">↻ ' + esc(rep) + '</span>');
  if(t.bron === 'yoobi' && t._rubriek !== 'vervallen') p.push('<span class="pill yoobi">Yoobi</span>');
  if(t.tel || t.klant_tel) p.push('<span class="pill tel">✆ bellen</span>');
  if(t.foto_pad) p.push('<span class="pill foto">📷</span>');
  if(t.klantnaam && t.bron === 'eigen') p.push('<span class="pill klant">' + esc(t.klantnaam) + '</span>');
  if(t._rubriek === 'voltooid' && t._voltooid) p.push('<span class="pill date">✓ ' + esc(datumTekst(t._voltooid)) + '</span>');
  if(t._rubriek === 'vervallen' && t._gepland) p.push('<span class="pill date">' + esc(datumTekst(t._gepland)) + '</span>');
  if(t._rubriek === 'herhalend' && !t._binnenWeek) p.push('<span class="pill date">verschijnt later</span>');
  return p.join('');
}

function kaart(t, hero){
  const metKlant = t.klantnaam && t.bron === 'yoobi';
  const titel = metKlant ? esc(t.onderwerp) + ' — ' + esc(t.klantnaam) : esc(t.onderwerp);
  const meta = pillen(t);
  const bel = (t._rubriek === 'voltooid' || t._rubriek === 'vervallen') ? '' :
    '<span class="bell' + (t.piep ? ' on' : '') + '">' + (t.piep ? '🔔' : '🔕') + '</span>';
  return '<div class="card' + (hero ? ' hero' : '') + '" tabindex="0" data-id="' + esc(t.crmtaskid) + '">' +
    (hero ? '<span class="now">Nu</span>' : '') +
    '<span class="who" style="background:' + PERSOON[t._persoon].css + '"></span>' +
    '<span class="body"><div class="ttl">' + titel + '</div>' +
    (meta ? '<div class="meta">' + meta + '</div>' : '') +
    '</span>' + bel + '</div>';
}

/* De Nu-badge: de taak waarvan het tijdstip het dichtst bij dit
   moment ligt. Zonder tijden is er geen Nu. */
function actueleHero(lijst){
  const nu = new Date();
  let beste = null, afstand = Infinity;
  lijst.forEach(function(t){
    if(!t._gepland) return;
    const d = Math.abs(t._gepland - nu);
    if(d < afstand){ afstand = d; beste = t.crmtaskid; }
  });
  return beste;
}

function sorteer(lijst, rubriek){
  const kopie = lijst.slice();
  if(rubriek === 'voltooid'){
    kopie.sort((a,b) => (b._voltooid || 0) - (a._voltooid || 0));
  } else {
    kopie.sort((a,b) => {
      if(!a._gepland && !b._gepland) return 0;
      if(!a._gepland) return 1;
      if(!b._gepland) return -1;
      return a._gepland - b._gepland;
    });
  }
  return kopie;
}

function bouwRubriek(r){
  const eigen = sorteer(TAKEN.filter(t => t._rubriek === r.key), r.key);
  const open = OPEN_STAND[r.key];

  let zichtbaar = eigen;
  let sub = r.sub;
  let extraNoot = '';
  if(r.key === 'herhalend'){
    zichtbaar = eigen.filter(t => t._binnenWeek);
    const verborgen = eigen.length - zichtbaar.length;
    sub = zichtbaar.length + ' speelt deze week · ' + verborgen + ' verderop';
    if(verborgen > 0) extraNoot = '<div class="hidnote">De rest verschijnt vanzelf zodra hij binnen een week valt.</div>';
  }

  let heroId = null;
  if(r.key === 'vandaag'){
    heroId = actueleHero(zichtbaar);
    LAATSTE_HERO = heroId;
  }

  const gatehint = (r.key === 'klant' && !NA_VIER && !open) ?
    '<div class="gatehint"><span>◷ Verschijnt vanzelf na 16:00</span>' +
    '<button type="button" data-toon="klant">Nu tonen</button></div>' : '';

  const kaarten = zichtbaar.length
    ? zichtbaar.map(t => kaart(t, t.crmtaskid === heroId)).join('')
    : '<div class="hidnote">niets hier</div>';

  return '<div class="section' + (open ? ' open' : '') + (r.klasse ? ' ' + r.klasse : '') + '" data-key="' + r.key + '">' +
    '<button class="head" aria-expanded="' + open + '">' +
    cluster(eigen) +
    '<span class="title"><span class="t">' + r.titel + '</span><span class="sub">' + sub + '</span></span>' +
    '<span class="count">' + eigen.length + '</span><span class="chev"></span>' +
    '</button>' + gatehint +
    '<div class="cards"><div class="inner">' + kaarten + extraNoot + '</div></div></div>';
}

function bouwMeetstrook(){
  const open = TAKEN.filter(t => t._rubriek !== 'voltooid' && t._rubriek !== 'vervallen');
  const telling = {};
  PERSOON_VOLGORDE.forEach(p => telling[p] = 0);
  open.forEach(t => telling[t._persoon]++);

  const segs = PERSOON_VOLGORDE.filter(p => telling[p] > 0)
    .map(p => '<i style="flex:' + telling[p] + ';background:' + PERSOON[p].css + '"></i>').join('');
  const legend = PERSOON_VOLGORDE.filter(p => telling[p] > 0)
    .map(p => '<span><i class="d" style="background:' + PERSOON[p].css + '"></i>' + PERSOON[p].naam + ' ' + telling[p] + '</span>').join('');

  return '<div class="meten">' +
    '<div class="lbl"><b>Verdeling</b><span>' + open.length + ' openstaand</span></div>' +
    '<div class="bar">' + segs + '</div>' +
    '<div class="legend">' + legend + '</div></div>';
}

function bouwVoet(){
  const naam = IK ? PERSOON[IK.persoon].naam : '';
  return '<div class="voet"><span>taken ' + APP_VERSION + (naam ? ' · aangemeld als ' + esc(naam) : '') + '</span>' +
    '<button type="button" id="afmelden">afmelden</button></div>';
}

function render(){
  const scrollY = window.scrollY;
  document.getElementById('lijst').innerHTML =
    RUBRIEKEN.map(bouwRubriek).join('') + bouwMeetstrook() + bouwVoet();
  window.scrollTo(0, scrollY);
}

function openTask(t){
  const isYoobi = t.bron === 'yoobi';
  const isKlaar = t._rubriek === 'voltooid' || t._rubriek === 'vervallen';
  const modus = isKlaar ? 'klaar' : (isYoobi ? 'yoobi' : 'eigen');
  VEL = { modus: modus, taak: t, soort: t.soort === 'herhalend' ? 'herhalend' : 'eenmalig', persoon: t._persoon, fotoBlob: null, fotoWeg: false };

  /* titel */
  zet('s_title', modus !== 'eigen');
  zet('s_titelinput', modus === 'eigen');
  document.getElementById('s_title').textContent = t.onderwerp || 'Taak';
  document.getElementById('s_titelinput').value = t.onderwerp || '';

  /* wie-regel */
  const pk = PERSOON[t._persoon];
  document.getElementById('s_whorow').innerHTML =
    '<span style="width:13px;height:13px;border-radius:50%;background:' + pk.css + '"></span>' +
    '<span style="font-size:13px;font-weight:700;color:var(--ink-soft)">' + esc(pk.naam) + '</span>' +
    (t.klantnaam ? '<span class="pill klant">' + esc(t.klantnaam) + '</span>' : '') +
    (isYoobi ? '<span class="pill yoobi">Yoobi · alleen bekijken</span>' : '') +
    (t._voltooid ? '<span class="pill date">✓ ' + esc(datumTekst(t._voltooid)) + '</span>' : '');

  /* afvink-knop */
  const klaarKnop = document.getElementById('s_klaar');
  if(modus === 'eigen'){
    zet('s_klaar', true);
    klaarKnop.textContent = '✓ Afvinken';
    klaarKnop.classList.remove('terug');
  } else if(modus === 'klaar' && t.bron === 'eigen' && t._rubriek === 'voltooid'){
    zet('s_klaar', true);
    klaarKnop.textContent = '↩ Terug naar open';
    klaarKnop.classList.add('terug');
  } else zet('s_klaar', false);

  /* soort en ritme */
  zet('s_soortwrap', modus === 'eigen');
  if(modus === 'eigen'){
    setSoort(VEL.soort);
    document.getElementById('s_ritme_n').value = t.herhaling_n || 1;
    document.getElementById('s_ritme_eenheid').value = t.herhaling_eenheid || 'week';
  }

  /* notitie */
  zet('s_notewrap', !isYoobi);
  document.getElementById('s_note').value = t.notitie || '';
  document.getElementById('s_note').readOnly = modus === 'klaar';

  /* foto */
  zet('s_fotowrap_fld', modus === 'eigen' || (modus === 'klaar' && t.foto_pad));
  toonFoto(null);
  if(t.foto_pad){
    sb.storage.from(FOTO_BUCKET).createSignedUrl(t.foto_pad, 3600).then(res => {
      if(res.data && res.data.signedUrl && VEL && VEL.taak === t) toonFoto(res.data.signedUrl);
    });
  }
  zet('s_fotoweg', modus === 'eigen');

  /* wanneer */
  zet('s_wanneer_lezen', modus !== 'eigen');
  zet('s_wanneer_invullen', modus === 'eigen');
  const dTekst = datumTekst(t._gepland);
  const uTekst = tijdTekst(t._gepland);
  document.getElementById('s_date').textContent = dTekst || (t._voltooid ? '—' : 'geen datum');
  document.getElementById('s_tijd').textContent = uTekst || '—';
  document.getElementById('s_datum_in').value = t._gepland ? lokaalISO(t._gepland) : '';
  document.getElementById('s_tijd_in').value = uTekst || '';

  /* herhaling alleen-lezen blokje bij yoobi/klaar */
  const rep = herhalingTekst(t.herhaling_n, t.herhaling_eenheid);
  zet('s_repwrap', modus !== 'eigen' && !!rep);
  if(rep) document.getElementById('s_rep').textContent = rep;

  /* dagkeuze: eigen en yoobi, niet bij klaar */
  zet('s_vandaagwrap', modus === 'eigen' || modus === 'yoobi');
  const vandaagAan = t.vandaag && t.vandaag_op === lokaalISO(new Date());
  document.getElementById('s_vandaag').classList.toggle('uit', !vandaagAan);
  document.getElementById('s_vandaagtekst').textContent = vandaagAan ? 'Staat in Vandaag' : 'Vandaag oppakken';

  /* melding */
  zet('s_piepwrap', modus === 'eigen');
  zet('s_snooze', modus === 'eigen');
  document.getElementById('s_toggle').classList.toggle('uit', !t.piep);
  document.getElementById('s_toggletekst').textContent = t.piep ? 'Melding aan' : 'Melding uit';

  /* bellen */
  const nummer = t.tel || t.klant_tel;
  zet('s_telwrap', modus === 'eigen' || !!nummer);
  zet('s_telinput', modus === 'eigen');
  document.getElementById('s_telinput').value = t.tel || '';
  const a = document.getElementById('s_tel');
  if(nummer){
    a.style.display = '';
    a.textContent = '✆ ' + nummer;
    a.href = 'tel:' + String(nummer).replace(/\s/g,'');
  } else a.style.display = 'none';

  /* wie doet het */
  zet('s_pickwrap', modus === 'eigen');
  setPeople(t._persoon);

  /* onderste knoppen */
  zet('s_bewaar', modus === 'eigen');
  document.getElementById('s_bewaar').textContent = 'Bewaren';
  zet('s_weg', modus === 'eigen');

  toonVel();
}

function toonVel(){
  document.getElementById('scrim').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheet').scrollTop = 0;
}
function sluitVel(){
  document.getElementById('scrim').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  VEL = null;
}

/* ────────────────────────────────────────────────────────
   Schrijven: toevoegen, bewaren, afvinken, verwijderen
   ──────────────────────────────────────────────────────── */
function velWaarden(){
  const titel = document.getElementById('s_titelinput').value.trim();
  const notitie = document.getElementById('s_note').value.trim();
  const tel = document.getElementById('s_telinput').value.trim();
  const datum = document.getElementById('s_datum_in').value;
  const tijd = document.getElementById('s_tijd_in').value;
  const piepAan = !document.getElementById('s_toggle').classList.contains('uit');
  const vandaagAan = !document.getElementById('s_vandaag').classList.contains('uit');
  const n = parseInt(document.getElementById('s_ritme_n').value, 10) || 1;
  const eenheid = document.getElementById('s_ritme_eenheid').value;
  const ts = naarTimestamp(datum, tijd);
  let piep_op = null;
  if(piepAan && datum) piep_op = naarTimestamp(datum, tijd && tijd !== '00:00' ? tijd : '09:00');
  return { titel, notitie, tel, ts, piepAan, piep_op, vandaagAan, n, eenheid };
}

async function slaOp(){
  const w = velWaarden();
  if(!w.titel){ toast('Geef de taak eerst een naam'); return; }
  if(VEL.soort === 'herhalend' && !w.ts){ toast('Een herhaler heeft een datum als anker nodig'); return; }

  const knop = document.getElementById('s_bewaar');
  knop.disabled = true;

  const rij = {
    onderwerp: w.titel,
    notitie: w.notitie || null,
    tel: w.tel || null,
    gepland_op: w.ts,
    piep: w.piepAan,
    piep_op: w.piep_op,
    soort: VEL.soort,
    herhaling_n: VEL.soort === 'herhalend' ? w.n : null,
    herhaling_eenheid: VEL.soort === 'herhalend' ? w.eenheid : null,
    toegewezen_aan: VEL.persoon,
    vandaag: w.vandaagAan,
    vandaag_op: w.vandaagAan ? lokaalISO(new Date()) : null,
  };

  try{
    let taakId = null;
    if(VEL.modus === 'nieuw'){
      rij.bron = 'eigen';
      rij.status = 'actueel';
      rij.aangemaakt_door = UID;
      const { data, error } = await sb.from('taken').insert(rij).select().single();
      if(error) throw error;
      taakId = data.crmtaskid;
    } else {
      taakId = VEL.taak.crmtaskid;
      const { error } = await sb.from('taken').update(rij).eq('crmtaskid', taakId);
      if(error) throw error;
    }

    /* foto: nieuw gekozen of weggehaald */
    if(VEL.fotoBlob){
      const pad = taakId + '/' + Date.now() + '.jpg';
      const { error: upErr } = await sb.storage.from(FOTO_BUCKET)
        .upload(pad, VEL.fotoBlob, { contentType: 'image/jpeg' });
      if(upErr) throw upErr;
      const oud = VEL.taak ? VEL.taak.foto_pad : null;
      const { error: fpErr } = await sb.from('taken').update({ foto_pad: pad }).eq('crmtaskid', taakId);
      if(fpErr) throw fpErr;
      if(oud) sb.storage.from(FOTO_BUCKET).remove([oud]);
    } else if(VEL.fotoWeg && VEL.taak && VEL.taak.foto_pad){
      const oud = VEL.taak.foto_pad;
      const { error: fpErr } = await sb.from('taken').update({ foto_pad: null }).eq('crmtaskid', taakId);
      if(fpErr) throw fpErr;
      sb.storage.from(FOTO_BUCKET).remove([oud]);
    }

    sluitVel();
    toast(VEL === null && rij ? 'Bewaard' : 'Bewaard');
    await laadTaken();
  }catch(e){
    toast('Opslaan lukt niet: ' + (e.message || e));
  }finally{
    knop.disabled = false;
  }
}

async function vinkAf(){
  const t = VEL.taak;
  const nuTs = timestampVan(new Date());

  try{
    if(VEL.modus === 'klaar'){
      /* terug naar open */
      const { error } = await sb.from('taken').update({ voltooid_op: null }).eq('crmtaskid', t.crmtaskid);
      if(error) throw error;
      sluitVel();
      toast('Terug naar open');
      await laadTaken();
      return;
    }

    /* Wat in het vel staat is de waarheid: afvinken bewaart eerst. */
    const w = velWaarden();
    const vers = {
      notitie: w.notitie || null,
      tel: w.tel || null,
      piep: w.piepAan,
    };
    if(w.titel) vers.onderwerp = w.titel;

    if(t.soort === 'herhalend' && t.herhaling_n && t.herhaling_eenheid){
      /* logregel in Voltooid plus de herhaler schuift door */
      const kopie = {
        bron:'eigen', status:'actueel', soort:'eenmalig',
        onderwerp: w.titel || t.onderwerp, notitie: vers.notitie, tel: vers.tel,
        gepland_op: w.ts || t.gepland_op, toegewezen_aan: t.toegewezen_aan,
        piep:false, voltooid_op: nuTs, aangemaakt_door: UID,
      };
      const { data: nieuw, error: e1 } = await sb.from('taken').insert(kopie).select().single();
      if(e1) throw e1;
      const anker = w.ts ? parseTijdstip(w.ts) : t._gepland;
      const volgende = volgendeDatum(anker, t.herhaling_n, t.herhaling_eenheid);
      const volgendeTs = timestampVan(volgende);
      const herhalerUpdate = Object.assign({}, vers, {
        gepland_op: volgendeTs,
        piep_op: w.piepAan ? volgendeTs : null,
        vandaag: false, vandaag_op: null,
      });
      const { error: e2 } = await sb.from('taken').update(herhalerUpdate).eq('crmtaskid', t.crmtaskid);
      if(e2) throw e2;
      LAATSTE_AFVINK = { type:'herhaler', kopieId: nieuw.crmtaskid, taakId: t.crmtaskid,
        oudeDatum: t.gepland_op, oudePiepOp: t.piep_op, oudVandaag: t.vandaag, oudVandaagOp: t.vandaag_op };
      sluitVel();
      toastMetActie('Afgevinkt, volgende keer ' + datumTekst(volgende), 'Ongedaan maken', maakOngedaan);
    } else {
      const upd = Object.assign({}, vers, {
        gepland_op: w.ts, piep_op: w.piep_op, voltooid_op: nuTs,
      });
      const { error } = await sb.from('taken').update(upd).eq('crmtaskid', t.crmtaskid);
      if(error) throw error;
      LAATSTE_AFVINK = { type:'gewoon', taakId: t.crmtaskid };
      sluitVel();
      toastMetActie('Afgevinkt', 'Ongedaan maken', maakOngedaan);
    }
    await laadTaken();
  }catch(e){
    toast('Afvinken lukt niet: ' + (e.message || e));
  }
}

async function maakOngedaan(){
  const u = LAATSTE_AFVINK;
  if(!u) return;
  LAATSTE_AFVINK = null;
  try{
    if(u.type === 'gewoon'){
      const { error } = await sb.from('taken').update({ voltooid_op: null }).eq('crmtaskid', u.taakId);
      if(error) throw error;
    } else {
      const { error: e1 } = await sb.from('taken').delete().eq('crmtaskid', u.kopieId);
      if(e1) throw e1;
      const { error: e2 } = await sb.from('taken').update({
        gepland_op: u.oudeDatum, piep_op: u.oudePiepOp,
        vandaag: u.oudVandaag, vandaag_op: u.oudVandaagOp,
      }).eq('crmtaskid', u.taakId);
      if(e2) throw e2;
    }
    toast('Teruggezet');
    await laadTaken();
  }catch(e){
    toast('Terugzetten lukt niet: ' + (e.message || e));
  }
}

async function verwijderTaak(){
  const t = VEL.taak;
  if(!confirm('Deze taak echt verwijderen?')) return;
  try{
    const { error } = await sb.from('taken').delete().eq('crmtaskid', t.crmtaskid);
    if(error) throw error;
    if(t.foto_pad) sb.storage.from(FOTO_BUCKET).remove([t.foto_pad]);
    sluitVel();
    toast('Verwijderd');
    await laadTaken();
  }catch(e){
    toast('Verwijderen lukt niet: ' + (e.message || e));
  }
}

/* Dagkeuze en piep schakelen direct bij een bestaande taak. */
async function schakelVandaag(){
  const aanNu = document.getElementById('s_vandaag').classList.contains('uit'); /* wordt aan */
  document.getElementById('s_vandaag').classList.toggle('uit', !aanNu);
  document.getElementById('s_vandaagtekst').textContent = aanNu ? 'Staat in Vandaag' : 'Vandaag oppakken';
  if(!VEL || VEL.modus === 'nieuw') return; /* bij nieuw gaat hij mee met Toevoegen */
  const t = VEL.taak;
  const { error } = await sb.from('taken').update({
    vandaag: aanNu, vandaag_op: aanNu ? lokaalISO(new Date()) : null,
  }).eq('crmtaskid', t.crmtaskid);
  if(error){ toast('Dagkeuze opslaan lukt niet: ' + error.message); return; }
  toast(aanNu ? 'Naar Vandaag' : 'Uit Vandaag');
  await laadTaken();
}

async function schakelPiep(){
  const aanNu = document.getElementById('s_toggle').classList.contains('uit'); /* wordt aan */
  document.getElementById('s_toggle').classList.toggle('uit', !aanNu);
  document.getElementById('s_toggletekst').textContent = aanNu ? 'Melding aan' : 'Melding uit';
  if(!VEL || VEL.modus === 'nieuw') return;
  const t = VEL.taak;
  let piep_op = null;
  if(aanNu && t._gepland){
    const u = tijdTekst(t._gepland);
    piep_op = naarTimestamp(lokaalISO(t._gepland), u || '09:00');
  }
  const { error } = await sb.from('taken').update({ piep: aanNu, piep_op: piep_op }).eq('crmtaskid', t.crmtaskid);
  if(error){ toast('Melding opslaan lukt niet: ' + error.message); return; }
  await laadTaken();
}

/* Uitstellen: verzet het meldingsmoment. De brug levert hem dan
   vanzelf opnieuw, want het geleverd-merkje klopt niet meer. */
async function verzetMelding(hoe){
  if(!VEL || VEL.modus !== 'eigen') return;
  const t = VEL.taak;
  const nu = new Date();
  let doel;
  if(hoe === 'min5'){ doel = new Date(nu.getTime() + 5 * 60000); }
  else if(hoe === 'uur1'){ doel = new Date(nu.getTime() + 3600000); }
  else if(hoe === 'avond'){
    doel = new Date(nu); doel.setHours(19, 0, 0, 0);
    if(doel <= nu) doel = new Date(nu.getTime() + 3600000);
  } else {
    doel = new Date(nu); doel.setDate(doel.getDate() + 1); doel.setHours(9, 0, 0, 0);
  }
  const doelTs = timestampVan(doel);
  const { error } = await sb.from('taken').update({
    piep: true, piep_op: doelTs, melding_geleverd_op: null,
  }).eq('crmtaskid', t.crmtaskid);
  if(error){ toast('Uitstellen lukt niet: ' + error.message); return; }
  document.getElementById('s_toggle').classList.remove('uit');
  document.getElementById('s_toggletekst').textContent = 'Melding aan';
  toast('Melding verzet naar ' + datumTekst(doel) + ' ' + tijdTekst(doel));
  await laadTaken();
}

/* ────────────────────────────────────────────────────────
   Foto: kiezen en verkleinen naar telefoonmaat
   ──────────────────────────────────────────────────────── */
async function verkleinFoto(file){
  try{
    const bitmap = await createImageBitmap(file);
    const maxKant = 1280;
    const schaal = Math.min(1, maxKant / Math.max(bitmap.width, bitmap.height));
    const b = Math.round(bitmap.width * schaal);
    const h = Math.round(bitmap.height * schaal);
    const canvas = document.createElement('canvas');
    canvas.width = b; canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, b, h);
    return await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
  }catch(e){
    return file; /* lukt verkleinen niet, dan het origineel */
  }
}

async function kiesFoto(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const blob = await verkleinFoto(file);
  VEL.fotoBlob = blob;
  VEL.fotoWeg = false;
  toonFoto(URL.createObjectURL(blob));
  if(VEL.modus !== 'nieuw') toast('Foto staat klaar, tik Bewaren om vast te leggen');
}

function fotoWeg(){
  VEL.fotoBlob = null;
  VEL.fotoWeg = true;
  toonFoto(null);
  if(VEL.modus !== 'nieuw') toast('Foto wordt weggehaald bij Bewaren');
}

/* ────────────────────────────────────────────────────────
   Toast
   ──────────────────────────────────────────────────────── */
function toast(tekst){
  const t = document.getElementById('toast');
  document.getElementById('toast_tekst').textContent = tekst;
  const knop = document.getElementById('toast_actie');
  knop.style.display = 'none';
  knop.onclick = null;
  t.classList.add('zie');
  clearTimeout(t._w);
  t._w = setTimeout(() => t.classList.remove('zie'), 2600);
}
function toastMetActie(tekst, actieTekst, fn){
  const t = document.getElementById('toast');
  document.getElementById('toast_tekst').textContent = tekst;
  const knop = document.getElementById('toast_actie');
  knop.textContent = actieTekst;
  knop.style.display = '';
  knop.onclick = function(){
    t.classList.remove('zie');
    fn();
  };
  t.classList.add('zie');
  clearTimeout(t._w);
  t._w = setTimeout(() => t.classList.remove('zie'), 6000);
}

/* ────────────────────────────────────────────────────────
   Aanmelden: eenmalig per toestel
   ──────────────────────────────────────────────────────── */
function toonLogin(){ document.getElementById('login').classList.add('zie'); }
function verbergLogin(){ document.getElementById('login').classList.remove('zie'); }
function loginFout(tekst){
  const f = document.getElementById('l_fout');
  f.textContent = tekst;
  f.classList.add('zie');
}

async function meldAan(){
  const email = document.getElementById('l_email').value.trim();
  const ww = document.getElementById('l_wachtwoord').value;
  if(!email || !ww){ loginFout('Vul e-mailadres en wachtwoord in.'); return; }
  const knop = document.getElementById('l_knop');
  knop.disabled = true; knop.textContent = 'Aanmelden…';
  const { error } = await sb.auth.signInWithPassword({ email: email, password: ww });
  knop.disabled = false; knop.textContent = 'Dit toestel aanmelden';
  if(error){ loginFout('Aanmelden lukt niet: ' + error.message); return; }
  verbergLogin();
  await start();
}

/* ────────────────────────────────────────────────────────
   Start
   ──────────────────────────────────────────────────────── */
function toonMelding(tekst, fout){
  document.getElementById('lijst').innerHTML =
    '<div class="melding' + (fout ? ' fout' : '') + '">' + tekst + '</div>' + bouwVoet();
}

async function laadProfiel(){
  const { data: sess } = await sb.auth.getSession();
  UID = sess && sess.session && sess.session.user ? sess.session.user.id : null;
  if(!UID) return false;

  const { data, error } = await sb.from('taken_rollen').select('*');
  if(error){
    toonMelding('De rollentabel is niet leesbaar: ' + esc(error.message), true);
    return false;
  }
  MAP_YOOBI = {};
  IK = null;
  (data || []).forEach(r => {
    if(r.yoobi_naam) MAP_YOOBI[r.yoobi_naam] = r.persoon;
    if(r.user_id === UID) IK = { persoon: r.persoon, rol: r.rol, yoobi_naam: r.yoobi_naam };
  });
  if(!IK){
    toonMelding('Dit account is aangemeld maar nog niet gekoppeld in taken_rollen. ' +
      'Gian kan de koppeling in Supabase Studio zetten.', true);
    return false;
  }
  return true;
}

async function laadTaken(){
  try{
    TAKEN = await haalTaken();
  }catch(e){
    toonMelding('Taken laden lukt niet: ' + esc(e.message || String(e)), true);
    return;
  }
  render();
}

async function start(){
  document.getElementById('datumVandaag').textContent = datumKort();
  const ok = await laadProfiel();
  if(!ok) return;
  await laadTaken();
}

async function init(){
  document.getElementById('datumVandaag').textContent = datumKort();
  const { data } = await sb.auth.getSession();
  if(data && data.session){
    await start();
  } else {
    document.getElementById('lijst').innerHTML = '<div class="melding">Dit toestel is nog niet aangemeld.</div>';
    toonLogin();
  }
}

/* ────────────────────────────────────────────────────────
   Gedrag
   ──────────────────────────────────────────────────────── */
document.getElementById('lijst').addEventListener('click', async function(e){
  if(e.target.closest('#afmelden')){
    await sb.auth.signOut();
    location.reload();
    return;
  }
  const toonKnop = e.target.closest('[data-toon]');
  if(toonKnop){
    e.stopPropagation();
    OPEN_STAND['klant'] = true;
    render();
    return;
  }
  const head = e.target.closest('.head');
  if(head){
    const sec = head.closest('.section');
    const key = sec.dataset.key;
    OPEN_STAND[key] = !OPEN_STAND[key];
    sec.classList.toggle('open', OPEN_STAND[key]);
    head.setAttribute('aria-expanded', OPEN_STAND[key] ? 'true' : 'false');
    head.blur();
    return;
  }
  const kaartEl = e.target.closest('.card');
  if(kaartEl){
    const t = TAKEN.find(x => x.crmtaskid === kaartEl.dataset.id);
    if(t) openTask(t);
  }
});

document.getElementById('lijst').addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const kaartEl = e.target.closest('.card');
  if(kaartEl){
    e.preventDefault();
    const t = TAKEN.find(x => x.crmtaskid === kaartEl.dataset.id);
    if(t) openTask(t);
  }
});

document.getElementById('fab').addEventListener('click', openNieuw);
document.getElementById('scrim').addEventListener('click', sluitVel);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') sluitVel(); });

document.getElementById('s_segment').addEventListener('click', function(e){
  const b = e.target.closest('button');
  if(b) setSoort(b.dataset.s);
});
document.getElementById('s_toggle').addEventListener('click', schakelPiep);
document.getElementById('s_vandaag').addEventListener('click', schakelVandaag);
document.getElementById('s_snooze').addEventListener('click', function(e){
  const b = e.target.closest('[data-snooze]');
  if(b) verzetMelding(b.dataset.snooze);
});
document.getElementById('s_picker').addEventListener('click', function(e){
  const b = e.target.closest('button');
  if(!b || b.disabled) return;
  VEL.persoon = b.dataset.p;
  setPeople(b.dataset.p);
});
document.getElementById('s_photo').addEventListener('click', function(){
  if(!VEL || VEL.modus === 'yoobi' || VEL.modus === 'klaar') return;
  document.getElementById('s_fotofile').click();
});
document.getElementById('s_fotofile').addEventListener('change', kiesFoto);
document.getElementById('s_fotoweg').addEventListener('click', function(e){
  e.stopPropagation();
  if(!VEL || VEL.modus === 'yoobi' || VEL.modus === 'klaar') return;
  fotoWeg();
});
document.getElementById('s_bewaar').addEventListener('click', slaOp);
document.getElementById('s_klaar').addEventListener('click', vinkAf);
document.getElementById('s_weg').addEventListener('click', verwijderTaak);
document.getElementById('l_knop').addEventListener('click', meldAan);
document.getElementById('l_wachtwoord').addEventListener('keydown', function(e){
  if(e.key === 'Enter') meldAan();
});

setInterval(function(){
  if(document.hidden || !TAKEN.length) return;
  document.getElementById('datumVandaag').textContent = datumKort();
  const vandaagLijst = TAKEN.filter(function(t){ return t._rubriek === 'vandaag'; });
  if(actueleHero(vandaagLijst) !== LAATSTE_HERO) render();
}, 60000);

document.addEventListener('visibilitychange', function(){
  if(!document.hidden && IK) laadTaken();
});

init();
</script>
