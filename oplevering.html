<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9">
<title>Oplevering — Ernes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#f6f7f9;
    --card:#ffffff;
    --ink:#191c21;
    --ink-soft:#5b636e;
    --ink-faint:#98a0ac;
    --line:#e7eaee;
    --blauw:#2563eb;
    --groen:#158048;
    --groen-tint:#ecfaf1;
    --groen-lijn:#c7ecd6;
    --oranje:#f97316;
    --oranje-tint:#fff4ec;
    --oranje-lijn:#f6d9c2;
    --ring:#ff3b30;
    --rood:#c0392b;
    --radius:16px;
    --shadow:0 1px 2px rgba(20,25,35,.05), 0 8px 24px rgba(20,25,35,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  .appbar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 20px 12px;flex:none}
  .brand-logo{height:44px;width:auto;display:block}
  .titlecol{text-align:right}
  .titlecol h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
  .titlecol .date{font-size:12.5px;color:var(--ink-soft);font-weight:500}

  .list{flex:1;padding:6px 16px calc(100px + env(safe-area-inset-bottom))}

  .melding{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;font-size:14px;color:var(--ink-soft);font-weight:600;
    box-shadow:var(--shadow);line-height:1.5}
  .melding.fout{border-color:#f3c1c1;background:#fdf6f6;color:#a43d3d}

  .kaart{display:flex;align-items:flex-start;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:12px 13px;cursor:pointer;
    box-shadow:0 1px 2px rgba(20,25,35,.04);margin-bottom:8px}
  .kaart .bol{width:13px;height:13px;border-radius:50%;flex:none;margin-top:3px}
  .bol.lopend{background:var(--oranje)}
  .bol.afgerond{background:var(--groen)}
  .kaart .mid{flex:1;min-width:0}
  .kaart .t{font-size:15px;font-weight:700;line-height:1.3}
  .kaart .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:500}
  .kaart .tel{font-size:11.5px;color:var(--ink-faint);margin-top:4px;font-weight:600}
  .pijl{width:9px;height:9px;border-right:2.2px solid var(--ink-faint);
    border-bottom:2.2px solid var(--ink-faint);transform:rotate(-45deg);margin-top:8px;flex:none}

  .schakel{display:block;width:100%;margin:12px 0 4px;padding:10px;border:1px dashed var(--line);
    background:transparent;border-radius:12px;color:var(--ink-soft);font:inherit;
    font-size:13px;font-weight:600;cursor:pointer}

  /* detail */
  .terug{background:none;border:none;font:inherit;font-size:14px;font-weight:700;
    color:var(--blauw);padding:2px 0 10px;cursor:pointer}
  .kop{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
  .kop h2{margin:0 0 2px;font-size:18px;font-weight:800;letter-spacing:-.3px}
  .kop .adres{font-size:13px;color:var(--ink-soft);line-height:1.45;white-space:pre-line}
  .kop .balkje{height:7px;border-radius:99px;background:#eef1f4;margin:12px 0 6px;overflow:hidden}
  .kop .balkje i{display:block;height:100%;background:var(--groen);border-radius:99px}
  .kop .voortgang{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .kop .knoppen{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .knopje{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
  .knopje.groen{background:var(--groen-tint);border-color:var(--groen-lijn);color:var(--groen)}
  .knopje.rood{color:var(--rood);border-color:#f0cfc9}

  .punt{display:flex;align-items:flex-start;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px;
    box-shadow:0 1px 2px rgba(20,25,35,.04)}
  .punt.klaar{background:var(--groen-tint);border-color:var(--groen-lijn)}
  .vink{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    background:#fff;cursor:pointer;font-size:15px;line-height:22px;text-align:center;
    color:transparent;padding:0}
  .vink.aan{background:var(--groen);border-color:var(--groen);color:#fff}
  .duim{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;
    border:1px solid var(--line);background:#eef1f4;cursor:pointer;display:block}
  .duim.leeg{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-faint)}
  .punt .tekst{flex:1;min-width:0;cursor:pointer}
  .punt .tekst .o{font-size:14.5px;font-weight:600;line-height:1.35;word-break:break-word}
  .punt .tekst .o.leeg{color:var(--ink-faint);font-weight:500}
  .punt .tekst .mkpil{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;
    color:#fff;background:var(--ring);border-radius:99px;padding:1px 7px}
  .punt.klaar .tekst .o{text-decoration:line-through;color:var(--ink-soft)}

  .toevoegrij{display:flex;gap:8px;margin-top:6px}
  .toevoegrij button{flex:1;padding:13px 8px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    box-shadow:0 1px 2px rgba(20,25,35,.04)}

  .fab{position:fixed;right:calc(50% - 215px + 18px);bottom:calc(22px + env(safe-area-inset-bottom));
    width:56px;height:56px;border-radius:50%;border:none;background:var(--blauw);color:#fff;
    font-size:30px;line-height:1;cursor:pointer;box-shadow:0 8px 22px rgba(37,99,235,.35);z-index:60}
  @media (max-width:466px){.fab{right:18px}}

  /* vellen */
  .scrim{position:fixed;inset:0;background:rgba(15,20,28,.42);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:70}
  .scrim.zie{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;transform:translate(-50%,110%);bottom:0;width:100%;max-width:430px;
    background:var(--card);border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(15,20,28,.18);transition:transform .25s;z-index:80;
    max-height:92vh;overflow-y:auto}
  .sheet.zie{transform:translate(-50%,0)}
  .grip{width:38px;height:4px;border-radius:99px;background:#e3e6ea;margin:0 auto 10px}
  .sheet h2{margin:2px 0 10px;font-size:18px;font-weight:800}
  .fld{margin-bottom:12px}
  .fld .k{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .veldinput{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
    font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .veldinput:focus{outline:none;border-color:var(--blauw);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea.veldinput{min-height:80px;resize:vertical;font-family:inherit}
  .rij2{display:flex;gap:10px}
  .rij2 > *{flex:1}
  .bewaarknop{width:100%;padding:14px;border:none;border-radius:13px;background:var(--blauw);
    color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px}
  .weglink{display:block;width:100%;background:none;border:none;color:var(--rood);
    font:inherit;font-size:13.5px;font-weight:700;padding:12px;cursor:pointer}

  .fotovak{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    background:#eef1f4;cursor:pointer}
  .fotovak img{display:block;width:100%;height:auto}
  .fotovak .lagen{position:absolute;inset:0}
  .fotovak .tik{position:absolute;left:0;right:0;bottom:0;background:rgba(15,20,28,.62);
    color:#fff;font-size:12px;font-weight:700;padding:6px 10px;text-align:center}
  .fotoknop{width:100%;padding:22px;border:1px dashed var(--line);border-radius:12px;
    background:#fbfcfd;color:var(--ink-soft);font:inherit;font-size:14px;font-weight:700;cursor:pointer}

  /* markering: open ring met nummer */
  .mk{position:absolute;width:7%;padding-bottom:7%;height:0;
    transform:translate(-50%,-50%) scale(var(--mkscale,1));
    border-radius:50%;border:3px solid var(--ring);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.95), inset 0 0 0 1.5px rgba(255,255,255,.95);
    cursor:pointer}
  .mk.sel{border-style:dashed}
  .mk .n{position:absolute;right:-7px;top:-11px;min-width:19px;height:19px;border-radius:10px;
    background:var(--ring);color:#fff;font-size:11px;font-weight:800;line-height:19px;
    text-align:center;padding:0 4px;box-shadow:0 0 0 1.5px rgba(255,255,255,.95)}

  /* markeer-editor */
  .mkov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);
    display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
  .mkbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
    background:rgba(20,20,20,.97);border-bottom:1px solid rgba(255,255,255,.1)}
  .mkbar button{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .mkbar button.actief{background:var(--ring);border-color:var(--ring)}
  .mkbar button.sluit{margin-left:auto;background:#fff;color:#111;border-color:#fff}
  .mkhint{padding:6px 12px;color:rgba(255,255,255,.7);font-size:12px;text-align:center;
    background:rgba(20,20,20,.97)}
  .mkstage{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none}
  .mkcontent{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .mkcontent img{display:block;width:100%;height:100%;pointer-events:none}
  .mknote{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(20,20,20,.98);border-top:1px solid rgba(255,255,255,.1)}
  .mknote input{flex:1;min-width:0;padding:10px;border:1px solid rgba(255,255,255,.25);
    border-radius:10px;background:#fff;font:inherit;font-size:14px}
  .mknote .del{padding:10px 12px;border:none;border-radius:10px;background:var(--rood);
    color:#fff;font:inherit;font-weight:700;cursor:pointer}

  /* aanmelden */
  .login{position:fixed;inset:0;background:var(--paper);display:none;align-items:center;
    justify-content:center;padding:24px;z-index:300}
  .login.zie{display:flex}
  .login .vak{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:24px;box-shadow:var(--shadow);text-align:center}
  .login img{height:46px;margin-bottom:14px}
  .login p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px}
  .login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;
    font:inherit;font-size:15px;margin-bottom:10px}
  .login .knop{width:100%;padding:13px;border:none;border-radius:12px;background:var(--blauw);
    color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
  .foutregel{color:var(--rood);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}

  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);background:#191c21;color:#fff;padding:11px 16px;border-radius:12px;
    font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    z-index:400;max-width:88vw;text-align:center}
  .toast.zie{opacity:1;transform:translate(-50%,0)}

  .voet{text-align:center;font-size:11px;color:var(--ink-faint);padding:18px 0 6px;font-weight:600}
</style>
</head>

<script>
/* ════════════════════════════════════════════════════════
   Oplevering — Ernes Schilders
   Losse app naast Schilders Calc en Taken. Eigen tabellen
   (opleveringen, oplever_punten) en een eigen opslagbak
   (oplever-fotos) in hetzelfde Supabase-project.
   ════════════════════════════════════════════════════════ */
const APP_VERSION = 'v0.1.0';

const SUPABASE_URL = 'https://gjcjpigirqbpkjkymbio.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hwl9kLXKLN6xQ3qoxDjqOw_QgH8ksOQ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'sb-oplever-auth' } });

const BUCKET = 'oplever-fotos';

let IK = null;              /* e-mailadres van de ingelogde gebruiker */
let LIJSTEN = [];           /* alle opleveringen */
let TELLING = {};           /* oplevering_id -> {totaal, open} */
let HUIDIG = null;          /* geopende oplevering, met .punten */
let TOON_AFGEROND = false;
let VEL_PUNT = null;        /* punt dat in het vel open staat */
let BEZIG = false;

/* ────────────────────────────────────────────────────────
   Klein gereedschap
   ──────────────────────────────────────────────────────── */
const WD = ['zo','ma','di','wo','do','vr','za'];
const MND = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

function datumKort(){
  const d = new Date();
  return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MND[d.getMonth()];
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(p){ return (p || '') + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function toast(t){
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('zie');
  clearTimeout(el._w);
  el._w = setTimeout(() => el.classList.remove('zie'), 2600);
}
/* Elke databaseaanroep loopt hierlangs, zodat een fout de echte
   melding van Supabase toont en niet een algemeen "mislukt". */
async function vraag(belofte, wat){
  try {
    const res = await belofte;
    if (res && res.error) {
      console.warn('[' + wat + ']', res.error);
      toast(wat + ' mislukt: ' + (res.error.message || 'onbekende fout'));
    }
    return res;
  } catch (e) {
    console.warn('[' + wat + ']', e);
    toast(wat + ' mislukt: ' + (e.message || 'onbekende fout'));
    return { data: null, error: e };
  }
}
function voet(){
  return '<div class="voet">Oplevering · ' + APP_VERSION + '</div>';
}

/* ────────────────────────────────────────────────────────
   Foto: verkleinen naar telefoonmaat
   Zelfde regel als in Schilders Calc: langste zijde 1600 px,
   JPEG kwaliteit 0,8. Lukt het verkleinen niet, dan gaat het
   origineel mee in plaats van niets.
   ──────────────────────────────────────────────────────── */
async function verkleinFoto(file){
  try {
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('lezen mislukt'));
      r.readAsDataURL(file);
    });
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('laden mislukt'));
      im.src = dataUrl;
    });
    let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const max = 1600;
    if (w > max || h > max) {
      if (w >= h) { h = Math.round(h * max / w); w = max; }
      else        { w = Math.round(w * max / h); h = max; }
    }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
    return blob || file;
  } catch (e) {
    console.warn('[verkleinen]', e);
    return file;
  }
}

async function tekenLinks(punten){
  const paden = (punten || []).map(p => p.storage_path).filter(Boolean);
  if (!paden.length) return;
  const res = await vraag(sb.storage.from(BUCKET).createSignedUrls(paden, 3600), 'Fotolinks ophalen');
  if (!res || res.error || !res.data) return;
  const perPad = {};
  res.data.forEach(d => { if (d && d.path) perPad[d.path] = d.signedUrl; });
  (punten || []).forEach(p => { p._url = perPad[p.storage_path] || null; });
}

/* ────────────────────────────────────────────────────────
   Laden
   ──────────────────────────────────────────────────────── */
async function laadLijsten(){
  const res = await vraag(
    sb.from('opleveringen').select('*').order('created_at', { ascending: false }),
    'Opleveringen laden'
  );
  if (!res || res.error) { toonMelding('De opleveringen zijn niet te lezen. Draai de SQL uit oplever_tabellen.sql als dat nog niet gebeurd is.', true); return false; }
  LIJSTEN = res.data || [];

  TELLING = {};
  if (LIJSTEN.length) {
    const tel = await vraag(
      sb.from('oplever_punten').select('oplevering_id, gereed'),
      'Punten tellen'
    );
    (tel && tel.data ? tel.data : []).forEach(r => {
      const t = TELLING[r.oplevering_id] || { totaal: 0, open: 0 };
      t.totaal++;
      if (!r.gereed) t.open++;
      TELLING[r.oplevering_id] = t;
    });
  }
  return true;
}

async function openOplevering(id){
  const o = LIJSTEN.find(x => x.id === id);
  if (!o) return;
  const res = await vraag(
    sb.from('oplever_punten').select('*').eq('oplevering_id', id).order('volgorde'),
    'Punten laden'
  );
  if (!res || res.error) return;
  o.punten = res.data || [];
  await tekenLinks(o.punten);
  HUIDIG = o;
  render();
}

/* ────────────────────────────────────────────────────────
   Tekenen
   ──────────────────────────────────────────────────────── */
function toonMelding(t, fout){
  document.getElementById('lijst').innerHTML =
    '<div class="melding' + (fout ? ' fout' : '') + '">' + t + '</div>' + voet();
}

function render(){
  document.getElementById('datumVandaag').textContent = datumKort();
  if (HUIDIG) renderDetail(); else renderOverzicht();
}

function renderOverzicht(){
  document.getElementById('fab').style.display = '';
  const lopend = LIJSTEN.filter(o => o.status !== 'afgerond');
  const klaar  = LIJSTEN.filter(o => o.status === 'afgerond');

  let html = '';
  if (!lopend.length) {
    html += '<div class="melding">Geen lopende opleveringen. Tik op de plusknop om er een te beginnen.</div>';
  } else {
    html += lopend.map(kaartHtml).join('');
  }
  if (klaar.length) {
    html += '<button class="schakel" onclick="wisselAfgerond()">' +
      (TOON_AFGEROND ? 'verberg afgeronde' : 'toon afgeronde (' + klaar.length + ')') + '</button>';
    if (TOON_AFGEROND) html += klaar.map(kaartHtml).join('');
  }
  document.getElementById('lijst').innerHTML = html + voet();
}

function kaartHtml(o){
  const t = TELLING[o.id] || { totaal: 0, open: 0 };
  const plaats = [o.adres, o.plaats].filter(Boolean).join(', ');
  let tel;
  if (!t.totaal) tel = 'nog geen punten';
  else if (!t.open) tel = t.totaal + ' punten, alles klaar';
  else tel = t.totaal + ' punten, ' + t.open + ' open';
  return '<div class="kaart" onclick="openOplevering(\'' + o.id + '\')">' +
    '<span class="bol ' + (o.status === 'afgerond' ? 'afgerond' : 'lopend') + '"></span>' +
    '<div class="mid">' +
      '<div class="t">' + esc(o.projectnaam) + '</div>' +
      (plaats ? '<div class="sub">' + esc(plaats) + '</div>' : '') +
      '<div class="tel">' + tel + '</div>' +
    '</div><span class="pijl"></span></div>';
}

function wisselAfgerond(){ TOON_AFGEROND = !TOON_AFGEROND; renderOverzicht(); }

function renderDetail(){
  document.getElementById('fab').style.display = 'none';
  const o = HUIDIG;
  const punten = o.punten || [];
  const klaar = punten.filter(p => p.gereed).length;
  const pct = punten.length ? Math.round(klaar / punten.length * 100) : 0;
  const adres = [o.klant, o.adres, [o.postcode, o.plaats].filter(Boolean).join(' ')].filter(Boolean).join('\n');

  let html = '<button class="terug" onclick="sluitDetail()">‹ Alle opleveringen</button>';
  html += '<div class="kop">' +
    '<h2>' + esc(o.projectnaam) + '</h2>' +
    (adres ? '<div class="adres">' + esc(adres) + '</div>' : '') +
    (o.notitie ? '<div class="adres" style="margin-top:6px">' + esc(o.notitie) + '</div>' : '') +
    '<div class="balkje"><i style="width:' + pct + '%"></i></div>' +
    '<div class="voortgang">' + klaar + ' van ' + punten.length + ' klaar</div>' +
    '<div class="knoppen">' +
      '<button class="knopje" onclick="bewerkOplevering()">Gegevens</button>' +
      (o.status === 'afgerond'
        ? '<button class="knopje" onclick="zetStatus(\'lopend\')">Heropenen</button>'
        : '<button class="knopje groen" onclick="zetStatus(\'afgerond\')">Oplevering afronden</button>') +
    '</div></div>';

  if (!punten.length) {
    html += '<div class="melding">Nog geen punten. Maak een foto van wat er nog moet gebeuren.</div>';
  } else {
    html += punten.map(puntHtml).join('');
  }

  html += '<div class="toevoegrij">' +
    '<button onclick="kiesFoto()">📷 Punt met foto</button>' +
    '<button onclick="nieuwPunt(null)">＋ Zonder foto</button>' +
    '</div>';

  document.getElementById('lijst').innerHTML = html + voet();
}

function puntHtml(p){
  const mk = Array.isArray(p.markeringen) ? p.markeringen : [];
  const duim = p._url
    ? '<img class="duim" src="' + p._url + '" alt="foto" onclick="opendMarkeer(\'' + p.id + '\')">'
    : '<div class="duim leeg" onclick="vervangFoto(\'' + p.id + '\')">📷</div>';
  const oms = (p.omschrijving || '').trim();
  return '<div class="punt' + (p.gereed ? ' klaar' : '') + '">' +
    '<button class="vink' + (p.gereed ? ' aan' : '') + '" onclick="wisselGereed(\'' + p.id + '\')" aria-label="Afvinken">✓</button>' +
    duim +
    '<div class="tekst" onclick="openPunt(\'' + p.id + '\')">' +
      '<div class="o' + (oms ? '' : ' leeg') + '">' + esc(oms || 'Geen omschrijving') + '</div>' +
      (mk.length ? '<span class="mkpil">' + mk.length + ' markering' + (mk.length === 1 ? '' : 'en') + '</span>' : '') +
    '</div></div>';
}

function sluitDetail(){ HUIDIG = null; render(); }

/* ────────────────────────────────────────────────────────
   Oplevering: nieuw, bewerken, status, verwijderen
   ──────────────────────────────────────────────────────── */
function toonVel(id, aan){
  document.getElementById(id).classList.toggle('zie', !!aan);
  document.getElementById('scrim').classList.toggle('zie', !!aan);
}
function sluitVellen(){
  toonVel('velOplevering', false);
  toonVel('velPunt', false);
  VEL_PUNT = null;
}

let VEL_OPL = null;   /* null = nieuw, anders de oplevering die je bewerkt */

function nieuweOplevering(){
  VEL_OPL = null;
  document.getElementById('o_titel').textContent = 'Nieuwe oplevering';
  ['o_project','o_klant','o_adres','o_postcode','o_plaats','o_notitie'].forEach(k => {
    document.getElementById(k).value = '';
  });
  document.getElementById('o_weg').style.display = 'none';
  toonVel('velOplevering', true);
  setTimeout(() => document.getElementById('o_project').focus(), 250);
}

function bewerkOplevering(){
  const o = HUIDIG; if (!o) return;
  VEL_OPL = o;
  document.getElementById('o_titel').textContent = 'Gegevens';
  document.getElementById('o_project').value  = o.projectnaam || '';
  document.getElementById('o_klant').value    = o.klant || '';
  document.getElementById('o_adres').value    = o.adres || '';
  document.getElementById('o_postcode').value = o.postcode || '';
  document.getElementById('o_plaats').value   = o.plaats || '';
  document.getElementById('o_notitie').value  = o.notitie || '';
  document.getElementById('o_weg').style.display = '';
  toonVel('velOplevering', true);
}

async function bewaarOplevering(){
  if (BEZIG) return;
  const rij = {
    projectnaam: document.getElementById('o_project').value.trim(),
    klant:       document.getElementById('o_klant').value.trim(),
    adres:       document.getElementById('o_adres').value.trim(),
    postcode:    document.getElementById('o_postcode').value.trim(),
    plaats:      document.getElementById('o_plaats').value.trim(),
    notitie:     document.getElementById('o_notitie').value.trim()
  };
  if (!rij.projectnaam) { toast('Een project zonder naam kan niet.'); return; }
  BEZIG = true;
  if (VEL_OPL) {
    const res = await vraag(sb.from('opleveringen').update(rij).eq('id', VEL_OPL.id).select(), 'Opslaan');
    BEZIG = false;
    if (!res || res.error || !res.data || !res.data[0]) return;
    Object.assign(VEL_OPL, res.data[0]);
    sluitVellen();
    render();
  } else {
    rij.status = 'lopend';
    rij.aangemaakt_door = IK;
    const res = await vraag(sb.from('opleveringen').insert([rij]).select(), 'Aanmaken');
    BEZIG = false;
    if (!res || res.error || !res.data || !res.data[0]) return;
    const nieuw = res.data[0];
    nieuw.punten = [];
    LIJSTEN.unshift(nieuw);
    TELLING[nieuw.id] = { totaal: 0, open: 0 };
    sluitVellen();
    HUIDIG = nieuw;
    render();
  }
}

async function zetStatus(status){
  const o = HUIDIG; if (!o) return;
  const rij = { status: status, afgerond_op: status === 'afgerond' ? new Date().toISOString() : null };
  const res = await vraag(sb.from('opleveringen').update(rij).eq('id', o.id).select(), 'Status wijzigen');
  if (!res || res.error || !res.data || !res.data[0]) return;
  Object.assign(o, res.data[0]);
  toast(status === 'afgerond' ? 'Oplevering afgerond.' : 'Weer op lopend.');
  render();
}

async function verwijderOplevering(){
  const o = VEL_OPL; if (!o) return;
  if (!confirm('Deze oplevering en al zijn punten verwijderen? Dat kan niet ongedaan gemaakt worden.')) return;
  /* Eerst de foto-map leegruimen, anders blijven de bestanden achter
     terwijl de rijen door de cascade verdwijnen. */
  const lijst = await vraag(sb.storage.from(BUCKET).list(o.id), 'Fotomap lezen');
  if (lijst && lijst.data && lijst.data.length) {
    await vraag(sb.storage.from(BUCKET).remove(lijst.data.map(f => o.id + '/' + f.name)), 'Fotomap opruimen');
  }
  const res = await vraag(sb.from('opleveringen').delete().eq('id', o.id), 'Verwijderen');
  if (!res || res.error) return;
  LIJSTEN = LIJSTEN.filter(x => x.id !== o.id);
  delete TELLING[o.id];
  sluitVellen();
  HUIDIG = null;
  render();
}

/* ────────────────────────────────────────────────────────
   Punten
   ──────────────────────────────────────────────────────── */
function kiesFoto(){
  const inv = document.getElementById('fotoInvoer');
  inv.value = '';
  inv.click();
}

async function nieuwPunt(file){
  if (!HUIDIG || BEZIG) return;
  BEZIG = true;
  let pad = null;
  if (file) {
    toast('Foto klaarzetten…');
    const blob = await verkleinFoto(file);
    pad = HUIDIG.id + '/' + uid('f') + '.jpg';
    const up = await vraag(
      sb.storage.from(BUCKET).upload(pad, blob, { contentType: 'image/jpeg', upsert: false }),
      'Foto uploaden'
    );
    if (!up || up.error) { BEZIG = false; return; }
  }
  const rij = {
    oplevering_id: HUIDIG.id,
    volgorde: (HUIDIG.punten || []).length,
    omschrijving: '',
    storage_path: pad,
    markeringen: []
  };
  const res = await vraag(sb.from('oplever_punten').insert([rij]).select(), 'Punt aanmaken');
  BEZIG = false;
  if (!res || res.error || !res.data || !res.data[0]) {
    if (pad) await vraag(sb.storage.from(BUCKET).remove([pad]), 'Foto opruimen');
    return;
  }
  const punt = res.data[0];
  if (!HUIDIG.punten) HUIDIG.punten = [];
  HUIDIG.punten.push(punt);
  await tekenLinks([punt]);
  bijwerkTelling();
  render();
  openPunt(punt.id);
}

function bijwerkTelling(){
  if (!HUIDIG) return;
  const p = HUIDIG.punten || [];
  TELLING[HUIDIG.id] = { totaal: p.length, open: p.filter(x => !x.gereed).length };
}

function puntBijId(id){
  return ((HUIDIG && HUIDIG.punten) || []).find(p => p.id === id) || null;
}

async function wisselGereed(id){
  const p = puntBijId(id); if (!p) return;
  const nieuw = !p.gereed;
  p.gereed = nieuw;
  p.gereed_op = nieuw ? new Date().toISOString() : null;
  p.gereed_door = nieuw ? IK : null;
  bijwerkTelling();
  render();
  const res = await vraag(
    sb.from('oplever_punten').update({ gereed: p.gereed, gereed_op: p.gereed_op, gereed_door: p.gereed_door }).eq('id', p.id),
    'Afvinken'
  );
  if (!res || res.error) {   /* terugdraaien als de database het weigert */
    p.gereed = !nieuw;
    p.gereed_op = null;
    bijwerkTelling();
    render();
  }
}

function openPunt(id){
  const p = puntBijId(id); if (!p) return;
  VEL_PUNT = p;
  document.getElementById('p_omschrijving').value = p.omschrijving || '';
  tekenPuntFoto();
  toonVel('velPunt', true);
}

function tekenPuntFoto(){
  const p = VEL_PUNT; if (!p) return;
  const vak = document.getElementById('p_fotofld');
  if (p._url) {
    const mk = Array.isArray(p.markeringen) ? p.markeringen : [];
    const ringen = mk.map((m, i) =>
      '<div class="mk" style="left:' + (m.fx * 100).toFixed(2) + '%;top:' + (m.fy * 100).toFixed(2) + '%">' +
      '<span class="n">' + (i + 1) + '</span></div>').join('');
    vak.innerHTML = '<div class="k">Foto</div>' +
      '<div class="fotovak" onclick="opendMarkeer(\'' + p.id + '\')">' +
        '<img src="' + p._url + '" alt="foto">' +
        '<div class="lagen">' + ringen + '</div>' +
        '<div class="tik">Tik om te markeren</div>' +
      '</div>' +
      '<button class="weglink" style="padding:8px 0 0" onclick="vervangFoto(\'' + p.id + '\')">Andere foto kiezen</button>';
  } else {
    vak.innerHTML = '<div class="k">Foto</div>' +
      '<button class="fotoknop" onclick="vervangFoto(\'' + p.id + '\')">📷 Foto toevoegen</button>';
  }
}

function vervangFoto(id){
  const p = puntBijId(id); if (!p) return;
  VEL_PUNT = p;
  const inv = document.getElementById('fotoVervang');
  inv.value = '';
  inv.click();
}

async function zetNieuweFoto(file){
  const p = VEL_PUNT; if (!p || !HUIDIG || BEZIG) return;
  BEZIG = true;
  toast('Foto klaarzetten…');
  const blob = await verkleinFoto(file);
  const pad = HUIDIG.id + '/' + uid('f') + '.jpg';
  const up = await vraag(
    sb.storage.from(BUCKET).upload(pad, blob, { contentType: 'image/jpeg', upsert: false }),
    'Foto uploaden'
  );
  if (!up || up.error) { BEZIG = false; return; }
  const oud = p.storage_path;
  const res = await vraag(
    sb.from('oplever_punten').update({ storage_path: pad, markeringen: [] }).eq('id', p.id).select(),
    'Foto opslaan'
  );
  BEZIG = false;
  if (!res || res.error || !res.data || !res.data[0]) {
    await vraag(sb.storage.from(BUCKET).remove([pad]), 'Foto opruimen');
    return;
  }
  Object.assign(p, res.data[0]);
  await tekenLinks([p]);
  if (oud) await vraag(sb.storage.from(BUCKET).remove([oud]), 'Oude foto opruimen');

  render();

async function bewaarPunt(){
  const p = VEL_PUNT; if (!p) return;
  const oms = document.getElementById('p_omschrijving').value.trim();
  p.omschrijving = oms;
  const res = await vraag(sb.from('oplever_punten').update({ omschrijving: oms }).eq('id', p.id), 'Opslaan');
  if (!res || res.error) return;
  sluitVellen();
  render();
}

async function verwijderPunt(){
  const p = VEL_PUNT; if (!p) return;
  if (!confirm('Dit punt verwijderen?')) return;
  if (p.storage_path) await vraag(sb.storage.from(BUCKET).remove([p.storage_path]), 'Fotobestand verwijderen');
  const res = await vraag(sb.from('oplever_punten').delete().eq('id', p.id), 'Verwijderen');
  if (!res || res.error) return;
  HUIDIG.punten = (HUIDIG.punten || []).filter(x => x.id !== p.id);
  bijwerkTelling();
  sluitVellen();
  render();
}

/* ────────────────────────────────────────────────────────
   Markeer-editor: open ringen met een nummer
   Zelfde rekenwijze als de foto-markeringen in Schilders Calc:
   posities als fractie nul tot een van de fotomaat, dus goed op
   elk scherm. Knijpen zoomt, slepen schuift, tikken plaatst.
   ──────────────────────────────────────────────────────── */
let MK_PUNT = null;
let MK_AAN = false;             /* staat het plaatsen aan */
let MK_SEL = null;              /* gekozen ring */
let MK_VIEW = { scale: 1, tx: 0, ty: 0 };
let MK_W0 = 0, MK_H0 = 0;
let MK_GEWIJZIGD = false;
const MK_PTR = new Map();
let MK_KNIJP = null, MK_SLEEP = null, MK_NEER = null;

function opendMarkeer(id){
  const p = puntBijId(id);
  if (!p || !p._url) { toast('Bij dit punt zit nog geen foto.'); return; }
  if (!Array.isArray(p.markeringen)) p.markeringen = [];
  MK_PUNT = p; MK_AAN = true; MK_SEL = null; MK_GEWIJZIGD = false;
  MK_VIEW = { scale: 1, tx: 0, ty: 0 };
  MK_PTR.clear(); MK_KNIJP = null; MK_SLEEP = null; MK_NEER = null;

  const ov = document.createElement('div');
  ov.className = 'mkov'; ov.id = 'mkov';
  ov.innerHTML =
    '<div class="mkbar" id="mkbar"></div>' +
    '<div class="mkhint" id="mkhint"></div>' +
    '<div class="mkstage" id="mkstage"><div class="mkcontent" id="mkcontent">' +
      '<img id="mkimg" alt="foto"><div id="mkringen"></div></div></div>' +
    '<div class="mknote" id="mknote" style="display:none"></div>';
  document.body.appendChild(ov);

  const img = document.getElementById('mkimg');
  img.onload = () => { mkPassend(); mkTekenRingen(); };
  img.src = p._url;

  mkTekenBalk();
  const stage = document.getElementById('mkstage');
  stage.addEventListener('pointerdown', mkNeer);
  stage.addEventListener('pointermove', mkBeweeg);
  stage.addEventListener('pointerup', mkOp);
  stage.addEventListener('pointercancel', mkOp);
  window.addEventListener('resize', mkHerschaal);
}

function mkHerschaal(){
  if (MK_SEL != null || MK_VIEW.scale > 1.01) return;
  mkPassend();
}

async function mkSluit(){
  const ov = document.getElementById('mkov');
  if (ov) ov.remove();
  window.removeEventListener('resize', mkHerschaal);
  const p = MK_PUNT;
  MK_PUNT = null; MK_SEL = null; MK_AAN = false;
  if (p && MK_GEWIJZIGD) {
    await vraag(
      sb.from('oplever_punten').update({ markeringen: p.markeringen }).eq('id', p.id),
      'Markeringen opslaan'
    );
  }
  if (VEL_PUNT && p && VEL_PUNT.id === p.id) tekenPuntFoto();
  render();
}

function mkPassend(){
  const stage = document.getElementById('mkstage');
  const img = document.getElementById('mkimg');
  const content = document.getElementById('mkcontent');
  if (!stage || !img || !content || !img.naturalWidth) return;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const ar = img.naturalWidth / img.naturalHeight;
  let w = sw, h = sw / ar;
  if (h > sh) { h = sh; w = sh * ar; }
  MK_W0 = w; MK_H0 = h;
  content.style.width = w + 'px';
  content.style.height = h + 'px';
  MK_VIEW = { scale: 1, tx: (sw - w) / 2, ty: (sh - h) / 2 };
  mkPas();
}

function mkPas(){
  const content = document.getElementById('mkcontent'); if (!content) return;
  const v = MK_VIEW;
  content.style.transform = 'translate(' + v.tx + 'px,' + v.ty + 'px) scale(' + v.scale + ')';
  content.style.setProperty('--mkscale', (1 / v.scale).toFixed(4));
}

function mkPunt(e){
  const stage = document.getElementById('mkstage');
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function mkNaarFractie(pt){
  const v = MK_VIEW;
  const cx = (pt.x - v.tx) / v.scale, cy = (pt.y - v.ty) / v.scale;
  return {
    fx: Math.min(1, Math.max(0, cx / MK_W0)),
    fy: Math.min(1, Math.max(0, cy / MK_H0))
  };
}

function mkNeer(e){
  e.preventDefault();
  const stage = document.getElementById('mkstage');
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  const p = mkPunt(e);
  MK_PTR.set(e.pointerId, p);
  if (MK_PTR.size === 1) {
    MK_NEER = { x: p.x, y: p.y, t: Date.now() };
    MK_SLEEP = { x: p.x, y: p.y };
    MK_KNIJP = null;
  } else if (MK_PTR.size === 2) {
    MK_SLEEP = null; MK_NEER = null;
    const pts = Array.from(MK_PTR.values());
    const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
    const v = MK_VIEW;
    MK_KNIJP = { dist: dist, s0: v.scale, C: { x: (mid.x - v.tx) / v.scale, y: (mid.y - v.ty) / v.scale } };
  }
}

function mkBeweeg(e){
  if (!MK_PTR.has(e.pointerId)) return;
  e.preventDefault();
  const p = mkPunt(e);
  MK_PTR.set(e.pointerId, p);
  if (MK_PTR.size >= 2 && MK_KNIJP) {
    const pts = Array.from(MK_PTR.values());
    const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
    let s = MK_KNIJP.s0 * (dist / MK_KNIJP.dist);
    s = Math.min(8, Math.max(1, s));
    MK_VIEW.scale = s;
    MK_VIEW.tx = mid.x - MK_KNIJP.C.x * s;
    MK_VIEW.ty = mid.y - MK_KNIJP.C.y * s;
    mkPas();
  } else if (MK_PTR.size === 1 && MK_SLEEP) {
    const dx = p.x - MK_SLEEP.x, dy = p.y - MK_SLEEP.y;
    if (MK_NEER && Math.hypot(p.x - MK_NEER.x, p.y - MK_NEER.y) > 8) MK_NEER = null;
    MK_VIEW.tx += dx; MK_VIEW.ty += dy;
    MK_SLEEP = { x: p.x, y: p.y };
    mkPas();
  }
}

function mkOp(e){
  const nu = mkPunt(e);
  const wasTik = MK_PTR.size === 1 && MK_NEER &&
    (Date.now() - MK_NEER.t) < 350 &&
    Math.hypot(nu.x - MK_NEER.x, nu.y - MK_NEER.y) <= 8;
  const tikPt = MK_NEER ? { x: MK_NEER.x, y: MK_NEER.y } : null;
  MK_PTR.delete(e.pointerId);
  if (MK_PTR.size < 2) MK_KNIJP = null;
  if (MK_PTR.size === 0) MK_SLEEP = null;
  if (wasTik && tikPt) {
    /* Niet op e.target afgaan: door setPointerCapture is dat altijd
       het tekenvlak. Bepaal geometrisch welke ring onder de tik zit. */
    const raak = mkRaak(tikPt);
    if (raak >= 0) {
      MK_SEL = raak; MK_AAN = false;
      mkTekenBalk(); mkTekenRingen(); mkTekenNotitie();
    } else if (MK_AAN) {
      const fr = mkNaarFractie(tikPt);
      mkPlaats(fr.fx, fr.fy);
    } else if (MK_SEL != null) {
      MK_SEL = null; mkTekenRingen(); mkTekenNotitie();
    }
  }
  MK_NEER = null;
}

function mkRaak(pt){
  const mk = (MK_PUNT && MK_PUNT.markeringen) || [];
  const v = MK_VIEW;
  const straal = Math.max(22, MK_W0 * 0.04);
  let best = -1, bestD = straal;
  for (let i = 0; i < mk.length; i++) {
    const sx = v.tx + (mk[i].fx * MK_W0) * v.scale;
    const sy = v.ty + (mk[i].fy * MK_H0) * v.scale;
    const d = Math.hypot(pt.x - sx, pt.y - sy);
    if (d <= bestD) { bestD = d; best = i; }
  }
  return best;
}

function mkTekenBalk(){
  const bar = document.getElementById('mkbar'); if (!bar) return;
  bar.innerHTML =
    '<button class="' + (MK_AAN ? 'actief' : '') + '" onclick="mkWissel()">◯ Markeren</button>' +
    '<button class="sluit" onclick="mkSluit()">Klaar</button>';
  const hint = document.getElementById('mkhint');
  if (hint) hint.textContent = MK_AAN
    ? 'Tik op de foto om een ring te zetten. Knijp om te zoomen, sleep om te schuiven.'
    : 'Tik een ring aan voor een notitie of om hem weg te halen. Knijp om te zoomen.';
}

function mkTekenRingen(){
  const wrap = document.getElementById('mkringen'); if (!wrap) return;
  const mk = (MK_PUNT && MK_PUNT.markeringen) || [];
  wrap.innerHTML = mk.map((m, i) =>
    '<div class="mk' + (MK_SEL === i ? ' sel' : '') + '" style="left:' + (m.fx * 100).toFixed(2) +
    '%;top:' + (m.fy * 100).toFixed(2) + '%"><span class="n">' + (i + 1) + '</span></div>').join('');
}

function mkTekenNotitie(){
  const note = document.getElementById('mknote'); if (!note) return;
  const mk = (MK_PUNT && MK_PUNT.markeringen) || [];
  if (MK_SEL == null || !mk[MK_SEL]) { note.style.display = 'none'; note.innerHTML = ''; return; }
  const m = mk[MK_SEL];
  note.style.display = 'flex';
  note.innerHTML =
    '<input type="text" value="' + esc(m.notitie || '') + '" placeholder="Notitie bij ring ' + (MK_SEL + 1) + '" oninput="mkNotitie(this.value)">' +
    '<button class="del" onclick="mkWeg()">Weg</button>';
}

function mkWissel(){
  MK_AAN = !MK_AAN;
  if (MK_AAN) { MK_SEL = null; mkTekenNotitie(); }
  mkTekenBalk(); mkTekenRingen();
}

function mkPlaats(fx, fy){
  if (!MK_PUNT) return;
  if (!Array.isArray(MK_PUNT.markeringen)) MK_PUNT.markeringen = [];
  MK_PUNT.markeringen.push({ fx: +fx.toFixed(4), fy: +fy.toFixed(4), notitie: '' });
  MK_SEL = MK_PUNT.markeringen.length - 1;
  MK_GEWIJZIGD = true;
  mkTekenRingen(); mkTekenNotitie();
}

function mkNotitie(val){
  const mk = (MK_PUNT && MK_PUNT.markeringen) || [];
  if (MK_SEL != null && mk[MK_SEL]) { mk[MK_SEL].notitie = val; MK_GEWIJZIGD = true; }
}

function mkWeg(){
  const mk = (MK_PUNT && MK_PUNT.markeringen) || [];
  if (MK_SEL == null || !mk[MK_SEL]) return;
  mk.splice(MK_SEL, 1);
  MK_SEL = null; MK_GEWIJZIGD = true;
  mkTekenRingen(); mkTekenNotitie();
}

/* ────────────────────────────────────────────────────────
   Aanmelden
   ──────────────────────────────────────────────────────── */
async function meldAan(){
  const email = document.getElementById('l_email').value.trim();
  const ww = document.getElementById('l_wachtwoord').value;
  const fout = document.getElementById('l_fout');
  if (!email || !ww) { fout.textContent = 'Vul e-mailadres en wachtwoord in.'; return; }
  const knop = document.getElementById('l_knop');
  knop.disabled = true; knop.textContent = 'Aanmelden…';
  const { error } = await sb.auth.signInWithPassword({ email: email, password: ww });
  knop.disabled = false; knop.textContent = 'Dit toestel aanmelden';
  if (error) { fout.textContent = 'Aanmelden lukt niet: ' + error.message; return; }
  document.getElementById('login').classList.remove('zie');
  await start();
}

/* ────────────────────────────────────────────────────────
   Start
   ──────────────────────────────────────────────────────── */
async function start(){
  document.getElementById('datumVandaag').textContent = datumKort();
  const { data: sess } = await sb.auth.getSession();
  const gebruiker = sess && sess.session && sess.session.user ? sess.session.user : null;
  if (!gebruiker) {
    document.getElementById('login').classList.add('zie');
    return;
  }
  IK = gebruiker.email || null;
  const ok = await laadLijsten();
  if (ok) render();
}

document.getElementById('fab').addEventListener('click', nieuweOplevering);
document.getElementById('scrim').addEventListener('click', sluitVellen);
document.getElementById('o_bewaar').addEventListener('click', bewaarOplevering);
document.getElementById('o_weg').addEventListener('click', verwijderOplevering);
document.getElementById('p_bewaar').addEventListener('click', bewaarPunt);
document.getElementById('p_weg').addEventListener('click', verwijderPunt);
document.getElementById('l_knop').addEventListener('click', meldAan);
document.getElementById('l_wachtwoord').addEventListener('keydown', e => { if (e.key === 'Enter') meldAan(); });
document.getElementById('fotoInvoer').addEventListener('change', function(){
  const f = this.files && this.files[0];
  if (f) nieuwPunt(f);
  this.value = '';
});
document.getElementById('fotoVervang').addEventListener('change', function(){
  const f = this.files && this.files[0];
  if (f) zetNieuweFoto(f);
  this.value = '';
});

start();
