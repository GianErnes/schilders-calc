<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDOK-test 2 · Schilders Calc</title>
<style>
  :root {
    --inkt:      #16202b;
    --grijs:     #5c6b7a;
    --lijn:      #d9e0e7;
    --papier:    #f7f9fb;
    --vlak:      #ffffff;
    --blauw:     #2563eb;
    --goed:      #16704a;
    --goedvlak:  #e6f4ee;
    --slecht:    #a3222b;
    --slechtvlak:#fdecec;
    --let:       #8a5a00;
    --letvlak:   #fdf3e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 1rem 3rem;
    background: var(--papier); color: var(--inkt);
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 .3rem; letter-spacing: -0.01em; }
  .sub { color: var(--grijs); font-size: .9rem; margin: 0 0 1.1rem; }
  .kaart {
    background: var(--vlak); border: 1px solid var(--lijn); border-radius: 10px;
    padding: .9rem 1rem; margin-bottom: .9rem;
  }
  label { display: block; font-size: .78rem; color: var(--grijs); margin: .6rem 0 .25rem; }
  input {
    width: 100%; padding: .55rem .6rem; font-size: 1rem; color: var(--inkt);
    border: 1px solid var(--lijn); border-radius: 7px; background: #fff;
  }
  input:focus-visible { outline: 2px solid var(--blauw); outline-offset: 1px; }
  .rij { display: flex; gap: .6rem; }
  .rij .breed { flex: 2 1 0; }
  .rij .smal  { flex: 1 1 0; }
  button {
    font: 600 1rem/1 inherit; color: #fff; background: var(--blauw);
    border: 0; border-radius: 7px; padding: .7rem 1.1rem; cursor: pointer;
    margin-top: 1rem;
  }
  button.stil { background: #fff; color: var(--inkt); border: 1px solid var(--lijn); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--blauw); outline-offset: 2px; }
  .proef { border-top: 1px solid var(--lijn); padding: .85rem 0 .3rem; }
  .proef:first-of-type { border-top: 0; }
  .proef h3 { font-size: .95rem; margin: 0 0 .15rem; }
  .adres {
    font: 400 .74rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--grijs); word-break: break-all; margin: 0 0 .5rem;
  }
  .stempel {
    display: inline-block; font-size: .8rem; font-weight: 600;
    padding: .3rem .6rem; border-radius: 6px; margin-bottom: .4rem;
  }
  .s-goed   { background: var(--goedvlak);   color: var(--goed); }
  .s-slecht { background: var(--slechtvlak); color: var(--slecht); }
  .s-let    { background: var(--letvlak);    color: var(--let); }
  .oordeel { font-size: .88rem; margin: 0 0 .35rem; }
  .ruw {
    font: 400 .72rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #f2f5f8; border-radius: 6px; padding: .45rem .55rem;
    color: var(--grijs); white-space: pre-wrap; word-break: break-all; margin: 0 0 .4rem;
  }
  .slot { border-left: 3px solid var(--blauw); }
  .slot h2 { font-size: 1rem; margin: 0 0 .4rem; }
  .slot p { margin: 0 0 .5rem; font-size: .92rem; }
  .herkomst { font-size: .78rem; color: var(--grijs); margin: 0; }
  textarea {
    width: 100%; height: 150px; margin-top: .6rem; padding: .5rem;
    font: 400 .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--lijn); border-radius: 7px; color: var(--grijs);
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>PDOK-test 2</h1>
  <p class="sub">Deze keer met exact de zoektermen die de app zelf maakt, en elke aanroep vijf keer achter elkaar. Zo wordt zichtbaar of het altijd misgaat of af en toe.</p>

  <div class="kaart">
    <p class="herkomst" id="herkomst">Herkomst wordt bepaald…</p>
  </div>

  <div class="kaart">
    <p class="sub" style="margin:0;">Neem hieronder over wat er in de calculatie staat waar het misgaat.</p>
    <div class="rij">
      <div class="breed">
        <label for="pc">Postcode werkadres</label>
        <input id="pc" type="text" value="6418BM" autocomplete="off">
      </div>
      <div class="smal">
        <label for="hn">Huisnr.</label>
        <input id="hn" type="text" value="75" autocomplete="off">
      </div>
    </div>
    <div class="rij">
      <div class="breed">
        <label for="vpc">Postcode vertrekadres</label>
        <input id="vpc" type="text" placeholder="uit Instellingen" autocomplete="off">
      </div>
      <div class="smal">
        <label for="vhn">Huisnr.</label>
        <input id="vhn" type="text" placeholder="2" autocomplete="off">
      </div>
    </div>
    <label for="orskey">OpenRouteService-sleutel (mag leeg blijven)</label>
    <input id="orskey" type="text" placeholder="alleen nodig voor de afstandstest" autocomplete="off">
    <button id="start">Test starten</button>
  </div>

  <div class="kaart" id="uitslag" hidden></div>
  <div class="kaart" id="slotkaart" hidden></div>

  <div class="kaart">
    <button id="kopieer" class="stil" style="margin-top:0;">Uitslag kopiëren</button>
    <textarea id="platte" readonly hidden></textarea>
  </div>

</div>

<script>
(function () {
  'use strict';

  var LS = 'https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=';
  var RONDEN = 5;
  var verslag = [];

  document.getElementById('herkomst').textContent = 'Herkomst van deze pagina: ' + location.origin;

  function el(tag, klasse, tekst) {
    var e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (tekst != null) e.textContent = tekst;
    return e;
  }
  function wacht(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  // Precies zoals de app de zoekterm bouwt: spaties eruit, hoofdletters, huisnummer erachter.
  function appZoekterm(pc, hn) {
    var p = (pc || '').replace(/\s+/g, '').toUpperCase();
    var h = (hn || '').trim();
    if (!p) return null;
    return h ? (p + ' ' + h) : p;
  }

  // Eén poging. Legt vast of er een antwoord kwam, met welke code, en wat de app
  // in dat geval op het scherm zou zetten.
  function poging(url, opties, meldingVorm) {
    var t0 = Date.now();
    return fetch(url, opties || {}).then(function (res) {
      return res.text().catch(function () { return ''; }).then(function (tekst) {
        var uit = { ms: Date.now() - t0, status: res.status, body: (tekst || '').slice(0, 200) };
        if (res.ok) {
          uit.goed = true;
        } else {
          uit.goed = false;
          uit.melding = meldingVorm.replace('%', 'PDOK ' + res.status);
        }
        return uit;
      });
    }).catch(function (err) {
      var f = (err && err.message) ? err.message : String(err);
      return { ms: Date.now() - t0, goed: false, netwerk: true, fout: f,
               melding: meldingVorm.replace('%', f) };
    });
  }

  function reeks(naam, url, opties, meldingVorm, aantal) {
    var uitkomsten = [];
    var keten = Promise.resolve();
    for (var i = 0; i < aantal; i++) {
      keten = keten.then(function () {
        return poging(url, opties, meldingVorm).then(function (u) {
          uitkomsten.push(u);
          return wacht(500);
        });
      });
    }
    return keten.then(function () {
      return { naam: naam, url: url, uitkomsten: uitkomsten };
    });
  }

  function toon(vak, r) {
    var goed = r.uitkomsten.filter(function (u) { return u.goed; }).length;
    var totaal = r.uitkomsten.length;
    var klasse = goed === totaal ? 's-goed' : (goed === 0 ? 's-slecht' : 's-let');
    var kop = goed === totaal ? 'Altijd gelukt'
            : (goed === 0 ? 'Altijd mislukt' : 'Wisselvallig');

    var blok = el('div', 'proef');
    blok.appendChild(el('h3', null, r.naam));
    blok.appendChild(el('p', 'adres', r.url));
    blok.appendChild(el('span', 'stempel ' + klasse, kop + ' · ' + goed + ' van ' + totaal));

    var eersteFout = null;
    var regels = r.uitkomsten.map(function (u, i) {
      if (!eersteFout && !u.goed) eersteFout = u;
      return (i + 1) + '. ' + (u.goed ? 'gelukt, code ' + u.status : (u.netwerk ? 'geen antwoord: ' + u.fout : 'geweigerd, code ' + u.status)) + ' (' + u.ms + ' ms)';
    });
    blok.appendChild(el('p', 'ruw', regels.join('\n')));

    if (eersteFout) {
      blok.appendChild(el('p', 'oordeel', 'De app zou dan tonen: ' + eersteFout.melding));
      if (!eersteFout.netwerk && eersteFout.body) {
        blok.appendChild(el('p', 'ruw', 'Antwoord van PDOK: ' + eersteFout.body));
      }
    } else if (r.uitkomsten[0] && r.uitkomsten[0].body) {
      blok.appendChild(el('p', 'ruw', 'Antwoord: ' + r.uitkomsten[0].body));
    }
    vak.appendChild(blok);
  }

  function slotsom() {
    var kaart = document.getElementById('slotkaart');
    kaart.className = 'kaart slot';
    kaart.hidden = false;
    kaart.innerHTML = '';
    kaart.appendChild(el('h2', null, 'Wat dit betekent'));

    var alles = [], niets = [], soms = [], geweigerd = false;
    verslag.forEach(function (r) {
      var goed = r.uitkomsten.filter(function (u) { return u.goed; }).length;
      if (goed === r.uitkomsten.length) alles.push(r.naam);
      else if (goed === 0) niets.push(r.naam);
      else soms.push(r.naam);
      r.uitkomsten.forEach(function (u) { if (!u.goed && !u.netwerk) geweigerd = true; });
    });

    var tekst;
    if (niets.length === verslag.length) {
      tekst = geweigerd
        ? 'Elke poging wordt afgewezen met een foutcode. PDOK antwoordt dus wel, maar accepteert deze zoekopdracht niet. Dat is te repareren in de app zelf.'
        : 'Geen enkele poging komt door, terwijl de vorige test wel lukte. Het verschil zit in de zoekterm die de app gebruikt.';
    } else if (soms.length) {
      tekst = 'De uitkomst wisselt per poging. Dan is de dienst zelf wisselvallig en helpt het om de app een paar keer te laten proberen voor hij opgeeft.';
    } else if (niets.length) {
      tekst = 'Een deel lukt altijd en een deel nooit. Kijk hierboven welke twee dat zijn: daar zit het verschil dat we zoeken.';
    } else {
      tekst = 'Alle pogingen lukken, ook met de zoekterm die de app gebruikt. Dan ligt het niet aan de aanroep zelf en moeten we in de app kijken wat er anders gaat.';
    }
    kaart.appendChild(el('p', null, tekst));
    kaart.appendChild(el('p', null, 'Druk onderaan op Uitslag kopiëren en plak het in de chat.'));
  }

  function platteTekst() {
    var r = ['PDOK-test 2 · ' + new Date().toLocaleString('nl-NL'), 'herkomst: ' + location.origin, ''];
    verslag.forEach(function (x) {
      var goed = x.uitkomsten.filter(function (u) { return u.goed; }).length;
      r.push(x.naam + ': ' + goed + ' van ' + x.uitkomsten.length + ' gelukt');
      r.push('  ' + x.url);
      x.uitkomsten.forEach(function (u, i) {
        r.push('  ' + (i + 1) + '. ' + (u.goed ? 'gelukt ' + u.status : (u.netwerk ? 'geen antwoord: ' + u.fout : 'geweigerd ' + u.status)) + ' (' + u.ms + ' ms)');
      });
      var f = x.uitkomsten.filter(function (u) { return !u.goed; })[0];
      if (f && f.body) r.push('  antwoord: ' + f.body.replace(/\s+/g, ' ').slice(0, 200));
      r.push('');
    });
    return r.join('\n');
  }

  document.getElementById('start').addEventListener('click', function () {
    var knop = this;
    var q  = appZoekterm(document.getElementById('pc').value, document.getElementById('hn').value);
    var qv = appZoekterm(document.getElementById('vpc').value, document.getElementById('vhn').value);
    var sleutel = (document.getElementById('orskey').value || '').trim();

    if (!q) { alert('Vul een postcode van het werkadres in.'); return; }

    knop.disabled = true;
    knop.textContent = 'Bezig…';
    verslag = [];
    var vak = document.getElementById('uitslag');
    vak.hidden = false;
    vak.innerHTML = '';
    document.getElementById('slotkaart').hidden = true;
    vak.appendChild(el('p', 'sub', 'Zoekterm van de app: "' + q + '"' + (qv ? ' · vertrek: "' + qv + '"' : '')));

    var taken = [
      ['1. Zoek straat en woonplaats (werkadres)',
       LS + encodeURIComponent(q) + '&fq=type:adres&rows=1&fl=straatnaam,woonplaatsnaam,postcode,huisnummer',
       null, 'Opzoeken mislukt: %', RONDEN],
      ['2. Coördinaten werkadres (afstandsknop, stap 2)',
       LS + encodeURIComponent(q) + '&fq=type:adres&rows=1',
       null, 'Ophalen mislukt (%)', RONDEN]
    ];
    if (qv) {
      taken.push(['3. Coördinaten vertrekadres (afstandsknop, stap 1)',
        LS + encodeURIComponent(qv) + '&fq=type:adres&rows=1',
        null, 'Ophalen mislukt (%)', RONDEN]);
    }
    if (sleutel) {
      taken.push(['4. Rijafstand via OpenRouteService',
        'https://api.openrouteservice.org/v2/directions/driving-car',
        { method: 'POST',
          headers: { 'Authorization': sleutel, 'Content-Type': 'application/json' },
          body: JSON.stringify({ coordinates: [[5.9797, 50.8882], [5.6909, 50.8514]] }) },
        'Ophalen mislukt (%)', 3]);
    }

    var keten = Promise.resolve();
    taken.forEach(function (t) {
      keten = keten.then(function () {
        return reeks(t[0], t[1], t[2], t[3], t[4]).then(function (r) {
          verslag.push(r);
          toon(vak, r);
        });
      });
    });
    keten.then(function () {
      slotsom();
      knop.disabled = false;
      knop.textContent = 'Opnieuw testen';
    });
  });

  document.getElementById('kopieer').addEventListener('click', function () {
    var knop = this;
    var tekst = platteTekst();
    var vak = document.getElementById('platte');
    function terugval() {
      vak.hidden = false;
      vak.value = tekst;
      vak.select();
      knop.textContent = 'Selecteer de tekst hieronder';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tekst).then(function () {
        knop.textContent = 'Gekopieerd';
        setTimeout(function () { knop.textContent = 'Uitslag kopiëren'; }, 2000);
      }).catch(terugval);
    } else {
      terugval();
    }
  });

})();
</script>
</body>
</html>
